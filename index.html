  /* ═════════════════════════ QUESTION BANK ═════════════════════════ */
  quiz: [
    { id: "q01", sec: "dimensions", ref: "1.10.2", q: "Which part of the airplane sets the minimum obstacle clearance path in a turn?",
      o: ["Nose", "Tail", "Wingtip", "Outboard engine nacelle"], a: 2,
      why: "The wingtip swings the largest arc (170 ft / 51.8 m). All other structure stays inside it." },
    { id: "q02", sec: "dimensions", ref: "1.10.2", q: "Minimum pavement width for a 180° turn?",
      o: ["150 ft (45.7 m)", "170 ft (51.8 m)", "172 ft (52.4 m)", "190 ft (57.9 m)"], a: 2,
      why: "172 ft (52.4 m). 150 ft is the tail radius and 170 ft the wingtip radius." },
    { id: "q03", sec: "dimensions", ref: "1.10.2", q: "Do not turn away from an obstacle within…",
      o: ["10 ft of the wingtip or 50 ft of the nose", "15 ft of the wingtip or 59 ft of the nose", "20 ft of the wingtip or 60 ft of the nose", "25 ft of the wingtip or 75 ft of the nose"], a: 1,
      why: "15 feet (4.6 m) of the wingtip or 59 feet (18.0 m) of the nose." },
    { id: "q04", sec: "dimensions", ref: "1.10.1", q: "Overall length of the 747-8F?",
      o: ["224 ft 5 in (68.4 m)", "231 ft 10 in (70.7 m)", "243 ft 6 in (74.2 m)", "250 ft 2 in (76.3 m)"], a: 3,
      why: "250 ft 2 in (76.3 m). 224 ft 5 in is the wingspan; 243 ft 6 in is nose to horizontal stabilizer tip." },
    { id: "q05", sec: "dimensions", ref: "1.10.2", q: "Which is NOT an assumption behind the published minimum turning radius?",
      o: ["Body gear steering operating", "No differential braking", "Minimum thrust on all engines", "Asymmetric thrust on the outboard engines"], a: 3,
      why: "The conditions are a slow continuous turn, minimum thrust on all engines, no differential braking, and body gear steering operating." },
    { id: "q06", sec: "dimensions", ref: "1.10.2", q: "Nose and tail turning radii are:",
      o: ["Nose 126 ft, tail 150 ft", "Nose 150 ft, tail 126 ft", "Nose 110 ft, tail 145 ft", "Nose 126 ft, tail 170 ft"], a: 0,
      why: "Nose 126 ft (38.4 m), tail 150 ft (45.7 m), wingtip 170 ft (51.8 m)." },

    { id: "q07", sec: "panels", ref: "1.30.1", q: "An alternate action switch that is pushed out (extended) is:",
      o: ["On, with its legend visible", "Off, with the legend shutter closed", "Faulted", "In test"], a: 1,
      why: "Extended = off; the mechanical shutter closes so the legend is hidden. Pushed in flush = on." },
    { id: "q08", sec: "panels", ref: "1.30.1", q: "A switch bulb has failed. What should the crew do?",
      o: ["Replace it from the spares kit with the system unpowered", "Swap it with an unused bulb on the same panel", "Contact maintenance", "Use IND LTS TEST to reset it"], a: 2,
      why: "Flight crews should not change switch bulbs. Bulb changes can cause damage with the system powered, and changes on the MCP may affect system operation in flight." },
    { id: "q09", sec: "panels", ref: "1.22.3", q: "Flap placard limit for flaps 25?",
      o: ["235 K", "220 K", "210 K", "185 K"], a: 2,
      why: "1-285, 5-265, 10-245, 20-235, 25-210, 30-185." },
    { id: "q10", sec: "panels", ref: "1.22.3", q: "Landing gear extended limit speed?",
      o: ["270 K / M.82", "290 K / M.82", "320 K / M.82", "320 K / M.86"], a: 2,
      why: "Retract and extend 270 K / M.82; extended 320 K / M.82." },
    { id: "q11", sec: "panels", ref: "1.22.5", q: "Which MFD synoptic is covered in Chapter 1?",
      o: ["ECS", "DRS", "STAT", "GEAR"], a: 1,
      why: "DRS (doors) is Chapter 1. ECS is 2, GEAR 14, and the status display is 15." },
    { id: "q12", sec: "panels", ref: "1.30.21", q: "GND TESTS switch at ENABLE:",
      o: ["Allows the Central Maintenance Computer to initiate ground tests", "Tests all annunciator lights", "Enables ground power to the cargo handling bus", "Inhibits EICAS messages on the ground"], a: 0,
      why: "ENABLE lets the CMC initiate ground tests. NORM (guard closed) configures systems for flight." },

    { id: "q13", sec: "fdlights", ref: "1.30.3", q: "Which light is NOT driven to full brightness by the STORM switch?",
      o: ["Dome lights", "Aisle stand flood lights", "Glareshield lights", "Map lights"], a: 3,
      why: "STORM covers the captain's and F/O's (forward panel flood) lights, glareshield lights, aisle stand flood lights and dome lights." },
    { id: "q14", sec: "fdlights", ref: "1.40.3", q: "Normal power to the aisle stand integral panel lights fails. Result?",
      o: ["Aisle stand goes dark until power is restored", "Aisle stand flood light illuminates at reduced intensity", "Storm lights come on automatically", "Emergency lights illuminate"], a: 1,
      why: "The aisle stand flood light comes on at reduced intensity. Flood lights in general run from standby power when normal power is lost." },
    { id: "q15", sec: "fdlights", ref: "1.30.6", q: "IND LTS held at TEST:",
      o: ["Lights all annunciators at full brightness for 10 seconds, then dims them while held", "Lights all annunciators until released", "Tests only master WARNING and CAUTION", "Flashes all annunciators for 5 seconds"], a: 0,
      why: "Full brightness for 10 seconds to check bulbs, then dimmed as long as the switch is held." },
    { id: "q16", sec: "fdlights", ref: "1.30.9", q: "The FLIGHT DECK ACCESS LTS work when which bus is powered?",
      o: ["Main deck cargo handling bus", "Ground handling bus", "DC bus 4", "Standby bus"], a: 1,
      why: "They light the path to or from the flight deck when the ground handling bus is powered." },
    { id: "q17", sec: "fdlights", ref: "1.30.9", q: "Which is NOT lit by the flight deck access lights?",
      o: ["Main Equipment Center lights", "Threshold light at Door 1L", "Upper deck lights above the crew access ladder", "Nose spot light"], a: 3,
      why: "Access lights: MEC lights, left sidewall light forward of 1L, threshold light at 1L, upper deck lights above the ladder, upper deck dome lights." },

    { id: "q18", sec: "decklights", ref: "1.40.4", q: "When do the nose door threshold (ramp) lights illuminate?",
      o: ["Whenever the THRESHOLD switch is ON", "Only with the nose cargo door full open", "Only with the nose door closed", "With emergency lights activated"], a: 1,
      why: "They are on the inside of the nose door and only illuminate, exposed, with the door in the full open position." },
    { id: "q19", sec: "decklights", ref: "1.40.4", q: "The nose spot light is used with the mirror to:",
      o: ["Check the nose door latches", "Verify the end locks are raised with cargo in the forward location", "Inspect the nose gear", "Light the loading ramp"], a: 1,
      why: "It lights the forward main deck with the nose door closed, to verify end locks raised when cargo is loaded forward." },
    { id: "q20", sec: "decklights", ref: "1.40.4", q: "Apart from main deck lighting, the seven forward ceiling lights also act as:",
      o: ["Emergency exit path lights", "Threshold lights", "Flight deck access lights", "Side cargo door ramp lights"], a: 1,
      why: "The seven forward ceiling lights also function as threshold lights. Only the one beside the crew ladder opening is a flight deck access light." },

    { id: "q21", sec: "extlights", ref: "1.40.1", q: "Landing lights ON, gear lever UP. The landing lights are:",
      o: ["Off", "Dimmed", "Full brightness", "Flashing"], a: 1,
      why: "Full brightness needs the gear lever DOWN; with the lever not DOWN they are dimmed." },
    { id: "q22", sec: "extlights", ref: "1.40.1", q: "Runway turnoff lights are aimed about how far from the centreline?",
      o: ["15°", "35°", "65°", "90°"], a: 2,
      why: "About 65° left and right. They are on the nose gear structure and work only in ground mode." },
    { id: "q23", sec: "extlights", ref: "1.30.14", q: "TAXI switch ON after liftoff. The taxi lights:",
      o: ["Stay on until the gear retracts", "Extinguish when air/ground sensing goes to air mode", "Dim", "Stay on until selected OFF"], a: 1,
      why: "Taxi and runway turnoff lights only illuminate with air/ground sensing in ground mode." },
    { id: "q24", sec: "extlights", ref: "1.30.15", q: "BEACON at LWR gives:",
      o: ["Lower red anti-collision beacon only", "Upper and lower beacons", "Lower white strobe", "Beacon at low intensity"], a: 0,
      why: "LWR = lower red beacon only; BOTH = upper and lower." },
    { id: "q25", sec: "extlights", ref: "1.30.15", q: "In addition to the position lights, NAV ON illuminates:",
      o: ["Logo lights", "Wing illumination lights", "White wingtip marker lights", "Runway turnoff lights"], a: 2,
      why: "NAV ON lights the red, green and white navigation lights and the white wingtip marker lights." },
    { id: "q26", sec: "extlights", ref: "1.40.2", q: "Where are the wing illumination lights?",
      o: ["Wingtips", "Engine pylons", "Fuselage", "Horizontal stabilizer"], a: 2,
      why: "On the fuselage, lighting the wings and engine nacelles. Logo lights are on the stabilizer." },
    { id: "q27", sec: "extlights", ref: "1.40.2", q: "White anti-collision strobes are located:",
      o: ["Top and bottom of the fuselage", "Each forward wingtip and the tail cone", "Wingtips only", "Nose gear"], a: 1,
      why: "Strobes: forward wingtips and tail cone. Beacons (red) are top and bottom of the fuselage." },

    { id: "q28", sec: "emerlights", ref: "1.40.5", q: "With EMER LIGHTS ARMED, the emergency lights come on automatically when:",
      o: ["A door is opened in flight", "DC power fails or is turned off", "Cabin altitude exceeds 10,000 ft", "The ELT activates"], a: 1,
      why: "Automatic operation occurs if DC power fails or is turned off with the system armed." },
    { id: "q29", sec: "emerlights", ref: "1.30.16", q: "Flight deck EMER LIGHTS is OFF. Someone pushes the cabin EMERGENCY LIGHTS switch. Result?",
      o: ["Nothing; the flight deck switch inhibits it", "All emergency lights illuminate", "Only main deck lights illuminate", "EMER LIGHTS advisory only"], a: 1,
      why: "The cabin switch on the upper deck cabin services module bypasses the flight deck switch." },
    { id: "q30", sec: "emerlights", ref: "1.40.5", q: "Minimum emergency lighting endurance on a fully charged battery?",
      o: ["10 minutes", "15 minutes", "20 minutes", "30 minutes"], a: 1,
      why: "At least 15 minutes, from remote batteries kept charged by DC bus 4." },
    { id: "q31", sec: "emerlights", ref: "1.40.5", q: "Which bus keeps the emergency lighting batteries charged?",
      o: ["DC bus 1", "DC bus 4", "Main battery bus", "Ground handling bus"], a: 1,
      why: "Battery charge is maintained by DC bus 4." },
    { id: "q32", sec: "emerlights", ref: "1.60.2", q: "The EMER LIGHTS advisory displays when:",
      o: ["The switch is not armed, or it is ARMED and the lights are on", "Battery endurance is below 15 minutes", "Only with the switch ON", "The cabin switch is pushed with power normal"], a: 0,
      why: "Logic: switch ARMED and emergency lights on, or switch not armed (OFF or ON)." },
    { id: "q33", sec: "emerlights", ref: "1.40.5", q: "The exterior emergency light below the crew service door lights:",
      o: ["The nose loading ramp", "The inertia reel landing zone", "The side cargo door sill", "The nose gear"], a: 1,
      why: "Exterior emergency lighting is an escape slide light plus a light illuminating the inertia reel landing zone." },

    { id: "q34", sec: "signs", ref: "1.40.4", q: "In AUTO, FASTEN SEAT BELTS illuminates below what airplane altitude?",
      o: ["10,000 ft", "10,300 ft", "12,000 ft", "14,000 ft"], a: 1,
      why: "Airplane altitude below 10,300 ft. The cabin altitude trigger is above 10,000 ft." },
    { id: "q35", sec: "signs", ref: "1.30.3", q: "Supernumerary oxygen deploys with SEATBELTS OFF. The signs show:",
      o: ["Nothing; the selector is OFF", "FASTEN SEAT BELTS on, RETURN TO SEAT off", "Both FASTEN SEAT BELTS and RETURN TO SEAT on", "RETURN TO SEAT only"], a: 1,
      why: "Whenever supernumerary oxygen deploys, FASTEN SEAT BELTS illuminates and RETURN TO SEAT extinguishes, regardless of selector position." },
    { id: "q36", sec: "signs", ref: "1.45.1", q: "Which event flashes the main deck ceiling lights WITHOUT sounding the horns?",
      o: ["Cabin altitude reaching 10,000 ft", "Smoke detected in the main deck", "FASTEN SEAT BELTS selected ON", "MAIN DECK ALERT switch pushed"], a: 2,
      why: "All four alert triggers give lights and horns. Selecting seat belts ON flashes the ceiling lights only." },
    { id: "q37", sec: "signs", ref: "1.45.1", q: "Which does NOT trigger the main deck alert lights and horns?",
      o: ["SUPRNMRY OXY switch selected ON", "Cabin altitude reaching 10,000 ft", "DOOR SIDE CARGO caution", "Smoke detected in the main deck"], a: 2,
      why: "Triggers: cabin altitude 10,000 ft, main deck smoke, SUPRNMRY OXY ON, MAIN DECK ALERT ON." },
    { id: "q38", sec: "signs", ref: "1.60.2", q: "When is the SEATBELTS OFF memo displayed?",
      o: ["Selector OFF on the ground", "Selector OFF in flight", "Selector AUTO with signs off", "Signs extinguished by AUTO logic"], a: 1,
      why: "SEATBELTS OFF memo: selector in OFF position in flight. SEATBELTS ON memo: signs manually selected ON." },
    { id: "q39", sec: "signs", ref: "1.40.4", q: "What sounds when the FASTEN SEAT BELTS signs change state?",
      o: ["Main deck horns", "A low tone over the PA", "The beeper", "Nothing"], a: 1,
      why: "A low tone sounds over the PA system whenever the signs illuminate or extinguish." },

    { id: "q40", sec: "oxygen", ref: "1.30.17", q: "With SUPRNMRY OXY at NORM, masks drop automatically at a cabin altitude of about:",
      o: ["10,000 ft", "12,000 ft", "14,000 ft", "15,000 ft"], a: 2,
      why: "Approximately 14,000 ft. RESET works below 12,000 ft; the main deck alert fires at 10,000 ft." },
    { id: "q41", sec: "oxygen", ref: "1.30.17", q: "SUPRNMRY OXY to RESET does what?",
      o: ["Re-stows the masks", "Closes the flow control unit electrically, with cabin altitude below 12,000 ft", "Tests the system", "Arms automatic deployment"], a: 1,
      why: "RESET (spring-loaded) closes the flow control unit electrically when cabin altitude is below 12,000 ft." },
    { id: "q42", sec: "oxygen", ref: "1.30.18", q: "Crew regulator at N (normal) supplies:",
      o: ["100% oxygen on demand", "Air/oxygen mixture on demand, ratio depending on cabin altitude", "100% oxygen under positive pressure", "Continuous flow"], a: 1,
      why: "N = diluted air/oxygen on demand; 100% = pure oxygen on demand; EMERGENCY = 100% under positive pressure." },
    { id: "q43", sec: "oxygen", ref: "1.30.18", q: "Rotating the regulator EMERGENCY selector provides:",
      o: ["100% oxygen under positive pressure at all cabin altitudes", "Air/oxygen mix at high flow", "100% on demand above 10,000 ft only", "Oxygen to the boom mic"], a: 0,
      why: "Positive pressure 100% protects against smoke and vapours and purges or defogs the mask, but depletes oxygen faster and makes communication harder." },
    { id: "q44", sec: "oxygen", ref: "1.40.7", q: "During the preflight mask check, oxygen pressure decreases. This may mean:",
      o: ["Normal; the hose is filling", "The crew oxygen cylinder shutoff valve is closed", "The regulator is in EMERGENCY", "The mask is not stowed correctly"], a: 1,
      why: "A pressure decrease during the check may indicate the cylinder shutoff valve is closed and oxygen is unavailable." },
    { id: "q45", sec: "oxygen", ref: "1.30.20", q: "Left door closed and OXY ON flag in view. Pushing RESET/TEST:",
      o: ["Tests the regulator momentarily", "Turns oxygen off, deactivates the mask mic and activates the boom mic", "Inflates the harness", "Selects 100%"], a: 1,
      why: "With OXY ON shown it shuts oxygen off and swaps to the boom mic. With OXY ON not shown it turns oxygen on momentarily to test." },
    { id: "q46", sec: "oxygen", ref: "1.40.7", q: "The mask microphone activates when:",
      o: ["The mask is donned", "The left-hand stowage box door opens", "RESET/TEST is pushed", "EMERGENCY is selected"], a: 1,
      why: "Opening the left-hand door of the stowage box activates the mask microphone." },
    { id: "q47", sec: "oxygen", ref: "1.40.10", q: "Before stowing, set the regulator to:",
      o: ["N, EMERGENCY off", "100%, EMERGENCY off (counterclockwise)", "100%, EMERGENCY on", "N, EMERGENCY on"], a: 1,
      why: "Press the N/100% rocker to 100% and turn the EMERGENCY knob counterclockwise to off." },
    { id: "q48", sec: "oxygen", ref: "1.40.13", q: "Oxygen flow to a supernumerary mask begins when:",
      o: ["The box door opens", "The mask or streamer is pulled down", "Cabin altitude exceeds 14,000 ft", "SUPRNMRY OXY is selected ON"], a: 1,
      why: "Flow begins when the mask or streamer is pulled. Closing the box's manifold toggle valve saves oxygen for masks still in use." },
    { id: "q49", sec: "oxygen", ref: "1.40.13", q: "On JA15KZ–JA18KZ, when supernumerary masks deploy, the crew rest gets:",
      o: ["Ceiling lights on, steady", "Flashing ceiling lights and an aural tone for several seconds", "No indication", "Emergency lights"], a: 1,
      why: "JA15KZ–JA18KZ: ceiling lights flash and a tone sounds in the crew rest. JA11KZ–JA14KZ: main deck ceiling lights flash and the crew rest ceiling lights illuminate." },
    { id: "q50", sec: "oxygen", ref: "1.45.3", q: "Walk-around oxygen bottles differ from the portable (first aid) bottles by having:",
      o: ["A disposable mask", "A full face mask and larger capacity", "Continuous flow only", "No regulator"], a: 1,
      why: "Portable bottles: disposable mask and safety straps, for first aid. Walk-around: full face mask and larger bottle." },
    { id: "q51", sec: "oxygen", ref: "1.30.17", q: "Where are crew and supernumerary oxygen pressures displayed?",
      o: ["ECS synoptic", "EICAS STATUS page", "Overhead panel gauge", "Upper EICAS permanently"], a: 1,
      why: "OXY PR (CREW and PASS) is on the status page, selected with STAT on the display select panel." },

    { id: "q52", sec: "emerequip", ref: "1.45.1", q: "To deactivate the fixed ELT after activation:",
      o: ["Select OFF", "RESET momentarily (1 to 3 seconds), then ARMED", "Hold RESET for 10 seconds", "Pull its circuit breaker"], a: 1,
      why: "Move the switch to RESET momentarily, between 1 and 3 seconds, then ARMED." },

    { id: "q61", sec: "doors", ref: "1.30.23", q: "The main deck entry door:",

<script>
/* widgets.js */
/* 747-8F Tech Guide — interactive panels for Chapter 1.
   Each widget builds its DOM once, then updates classes/text on state change. */
(function () {
  "use strict";
  const B = (window.B748 = window.B748 || { chapters: {} });
  const W = (B.W = B.W || {});

  /* ── shared helpers ── */
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function frame(el, title, o) {
    el.innerHTML = `<div class="wg-cap"><span class="wg-tag">Interactive</span><span class="wg-t">${title}</span><div class="wg-tools">${o.tools || ""}</div></div>
      <div class="wg-body">${o.body}</div>${o.foot ? `<p class="wg-foot">${o.foot}</p>` : ""}`;
    return el;
  }
  const seg = (key, opts, label) => `<div class="cond">${label ? `<span>${label}</span>` : ""}<div class="seg" role="group" aria-label="${esc(label || key)}">${opts.map((o) => {
    const v = Array.isArray(o) ? o[0] : o, l = Array.isArray(o) ? o[1] : o;
    return `<button data-seg="${key}" data-v="${esc(v)}" aria-pressed="false">${esc(l)}</button>`;
  }).join("")}</div></div>`;
  function setSeg(root, key, val) { root.querySelectorAll(`[data-seg="${key}"]`).forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === String(val)))); }
  const PH = 28;
  const sw = (key, label, pos, o = {}) => `<div class="sw ${o.guard ? "guard" : ""}" data-sw="${key}"><div class="sw-l">${label}</div>
    <div class="sw-b"><button class="sw-track" data-cycle="${key}" aria-label="${esc(label.replace(/<[^>]+>/g, " "))}, next position" style="height:${pos.length * PH - 2}px"><span class="sw-bat"></span></button>
    <div class="sw-pos">${pos.map((p) => `<button data-set="${key}" data-v="${esc(p)}" aria-pressed="false">${esc(p)}</button>`).join("")}</div></div></div>`;
  function setSw(root, key, val, pos) {
    const s = root.querySelector(`[data-sw="${key}"]`); if (!s) return;
    const i = Math.max(0, pos.indexOf(val));
    s.querySelector(".sw-bat").style.top = i * PH + 1 + "px";
    s.querySelectorAll("[data-set]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === val)));
    const g = s.classList.contains("guard");
    if (g) s.querySelector(".sw-track").style.outlineColor = val === s.dataset.guardpos ? "#d9433a" : "#d9433a55";
  }
  const lamp = (ref, label, c) => `<div class="lamp" data-lamp="${ref}" data-c="${c}"><i></i><span>${label}</span></div>`;
  function setLamp(root, ref, on) { const l = root.querySelector(`[data-lamp="${ref}"]`); if (l) l.classList.toggle("on", !!on); }
  const pb = (act, face, label, c) => `<button class="pb" data-pb="${act}" data-c="${c || "white"}"><span class="face">${face}</span>${label ? `<span>${label}</span>` : ""}</button>`;
  function setPb(root, act, on) { const b = root.querySelector(`[data-pb="${act}"]`); if (b) { b.classList.toggle("on", !!on); b.setAttribute("aria-pressed", String(!!on)); } }
  const holdSw = (key, label, pos) => `<div class="hold"><span class="hl">${label}</span><div class="hold-b">${pos.map((p) => `<button data-hold="${key}" data-v="${p[0]}" aria-pressed="false">${p[1]}</button>`).join("")}</div></div>`;
  function bindHolds(root, held, latch, onChange) {
    const set = (k, v) => { if (held[k] === v) return; held[k] = v; paint(); onChange(); };
    const paint = () => root.querySelectorAll("[data-hold]").forEach((b) => { const on = held[b.dataset.hold] === b.dataset.v; b.classList.toggle("held", on); b.setAttribute("aria-pressed", String(on)); });
    root.addEventListener("pointerdown", (e) => {
      const b = e.target.closest("[data-hold]"); if (!b) return;
      e.preventDefault();
      const k = b.dataset.hold, v = b.dataset.v;
      if (latch()) { set(k, held[k] === v ? null : v); return; }
      try { b.setPointerCapture(e.pointerId); } catch (x) {}
      set(k, v);
      const up = () => { set(k, null); b.removeEventListener("pointerup", up); b.removeEventListener("pointercancel", up); b.removeEventListener("lostpointercapture", up); };
      b.addEventListener("pointerup", up); b.addEventListener("pointercancel", up); b.addEventListener("lostpointercapture", up);
    });
    root.addEventListener("keydown", (e) => {
      const b = e.target.closest("[data-hold]"); if (!b || (e.key !== " " && e.key !== "Enter") || e.repeat) return;
      e.preventDefault(); const k = b.dataset.hold, v = b.dataset.v;
      if (latch()) set(k, held[k] === v ? null : v); else set(k, v);
    });
    root.addEventListener("keyup", (e) => { const b = e.target.closest("[data-hold]"); if (!b || latch()) return; if (e.key === " " || e.key === "Enter") set(b.dataset.hold, null); });
    root.addEventListener("click", (e) => { if (e.target.closest("[data-hold]")) e.preventDefault(); });
    return { paint, release() { Object.keys(held).forEach((k) => (held[k] = null)); paint(); } };
  }
  const holdMode = (id) => `<label class="hold-mode"><input type="checkbox" id="${id}" checked> Tap to latch switches (untick to press and hold, two-handed on iPad)</label>`;
  const eicasList = (msgs) => msgs.length ? msgs.map((m) => `<div class="${m[1]}">${esc(m[0])}</div>`).join("") : `<div class="none">NO MESSAGES</div>`;
  const orderMsgs = (list) => ["W", "C", "A", "M"].flatMap((l) => list.filter((m) => m[1] === l));
  const fmtAlt = (n) => n.toLocaleString("en-US");

  /* ── aircraft geometry (metres; nose at y=0, aft positive, x right) ── */
  const TOP = {
    fus: "M0,0 C1.9,0 3.25,2.8 3.25,8 L3.25,60 C3.25,68 1.6,74 0.45,76.3 L-0.45,76.3 C-1.6,74 -3.25,68 -3.25,60 L-3.25,8 C-3.25,2.8 -1.9,0 0,0 Z",
    wing: "M3.25,25.5 L31.5,49.2 L34.2,54.6 L33.6,55.6 L12,43.2 L3.25,41.5 Z",
    stab: "M2.7,63.5 L11,71.6 L11,74.2 L1.6,73.8 Z",
    fin: "M-0.35,61 L0.35,61 L0.3,76.3 L-0.3,76.3 Z",
    eng: [[11.9, 27.5, 3.3, 7], [21.1, 35.3, 3.1, 6.7]]
  };
  function topPlane(cls) {
    const half = `<path d="${TOP.wing}"/><path d="${TOP.stab}"/>${TOP.eng.map((e) => `<rect x="${e[0] - e[2] / 2}" y="${e[1]}" width="${e[2]}" height="${e[3]}" rx="1.1"/>`).join("")}`;
    return `<g class="${cls}">${half}<g transform="scale(-1,1)">${half}</g><path d="${TOP.fus}"/><path d="${TOP.fin}"/></g>`;
  }
  const SIDE = {
    body: "M0,4.8 C0,6.9 1.7,8.7 4.6,9.45 L8,9.89 L22,9.89 C26,9.89 28.5,8.6 32,8.5 L66,8.5 C71,8.4 74.5,7.6 76.3,6.7 L75.6,6.0 C72,4.9 66,3.5 58,2.6 L44,2.1 L14,2.1 C6,2.1 1.6,3.0 0,4.8 Z",
    fin: "M60,8.5 L72.6,19.4 L76.2,19.4 L75.2,7.4 Z",
    stab: "M64,7.1 L74.6,7.7 L74.4,8.1 L64,7.6 Z",
    wing: "M25.5,4.0 L56,6.2 L56.4,5.7 L41,3.4 L25.5,3.4 Z",
    win: "M3.3,8.2 L6.4,8.75 L6.4,9.25 L3.8,8.85 Z"
  };
  function sidePlane(cls) {
    return `<g class="${cls}"><path d="${SIDE.wing}" class="far"/><path d="${SIDE.fin}"/><path d="${SIDE.body}"/><path d="${SIDE.stab}"/>
      <rect x="27.5" y="1.5" width="7" height="3.1" rx="1.2"/><rect x="35.3" y="2.6" width="6.7" height="2.9" rx="1.1"/>
      <path d="${SIDE.win}" class="win"/>
      <path d="M7.7,2.3 V1.1 M36.6,2.2 V1.1 M38.4,2.2 V1.1" class="strut"/>
      <circle cx="7.7" cy=".62" r=".62"/><circle cx="35.9" cy=".62" r=".62"/><circle cx="37.3" cy=".62" r=".62"/><circle cx="38.7" cy=".62" r=".62"/></g>`;
  }
  function frontPlane(cls) {
    const half = `<path d="M3,4.2 L34.2,6.65 L34.2,7.05 L3,4.95 Z"/><path d="M0,7.0 L11,7.9 L11,8.25 L0,7.5 Z"/>
      <path d="M11.9,4.6 V5.3 M21.1,5.4 V6.1" class="strut"/><circle cx="11.9" cy="3.0" r="1.6"/><circle cx="21.1" cy="3.9" r="1.5"/>
      <rect x="1.35" y="0" width="1.1" height="1.25" rx=".3"/><rect x="5.815" y="0" width="1.1" height="1.25" rx=".3"/><path d="M1.9,1.25 V2.6 M6.365,1.25 V3.6" class="strut"/>`;
    return `<g class="${cls}"><path d="M-0.3,8.6 L0.3,8.6 L0.22,19.4 L-0.22,19.4 Z"/>${half}<g transform="scale(-1,1)">${half}</g>
      <ellipse cx="0" cy="8.6" rx="2.25" ry="1.5"/><ellipse cx="0" cy="5.6" rx="3.25" ry="3.55"/>
      <rect x="-0.75" y="0" width=".6" height="1.2" rx=".2"/><rect x="0.15" y="0" width=".6" height="1.2" rx=".2"/></g>`;
  }
  const arrowDefs = (id) => `<defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>`;
  function hdim(x1, x2, y, label, e1, e2, mk, lx, anchor) {
    const s = y > (e1 + e2) / 2 ? 0.6 : -0.6;
    return `<path class="ex" d="M${x1},${e1} V${y + s} M${x2},${e2} V${y + s}"/><path class="dl" d="M${x1},${y} H${x2}" marker-start="url(#${mk})" marker-end="url(#${mk})"/>
      <text class="dt" x="${lx != null ? lx : (x1 + x2) / 2}" y="${y - 0.75}" text-anchor="${anchor || "middle"}">${label}</text>`;
  }
  function vdim(y1, y2, x, label, e1, e2, mk, ly, anchor, tx) {
    const s = x > (e1 + e2) / 2 ? 0.6 : -0.6;
    return `<path class="ex" d="M${e1},${y1} H${x + s} M${e2},${y2} H${x + s}"/><path class="dl" d="M${x},${y1} V${y2}" marker-start="url(#${mk})" marker-end="url(#${mk})"/>
      <text class="dt" x="${tx != null ? tx : x + 1.2}" y="${ly != null ? ly : (y1 + y2) / 2 + 0.7}" text-anchor="${anchor || "start"}">${label}</text>`;
  }

  /* ════════ DIMENSIONS ════════ */
  W.dims = function (el) {
    const D = {
      span: ["224′ 5″", "68.4 m", "Wingspan"], len: ["250′ 2″", "76.3 m", "Overall length"], stabtip: ["243′ 6″", "74.2 m", "Nose to horizontal stabilizer tip"],
      stab: ["72′ 2″", "22.0 m", "Horizontal stabilizer span"], tail: ["63′ 6″", "19.4 m", "Tail height (fully loaded)"], fd: ["32′ 5.5″", "9.89 m", "Height, top of fuselage at flight deck"],
      ng: ["25′ 5″", "7.7 m", "Nose to nose gear"], wb: ["97′ 4″", "29.7 m", "Nose gear to main gear"], nm: ["122′ 9″", "37.4 m", "Nose to main gear"],
      bt: ["12′ 7″", "3.8 m", "Body gear track"], wt: ["41′ 9″", "12.73 m", "Wing gear track"]
    };
    const VIEWS = { plan: ["span", "len", "stabtip", "stab"], side: ["tail", "fd", "ng", "wb", "nm"], front: ["span", "bt", "wt"] };
    const st = { view: "plan", u: "ft" };
    frame(el, "Principal dimensions", {
      tools: seg("view", [["plan", "Plan"], ["side", "Side"], ["front", "Front"]]) + seg("u", [["ft", "ft"], ["m", "m"]]),
      body: `<div class="fig-scroll fig" data-fig></div><div class="tbl-wrap" style="margin-top:12px"><table class="num"><tbody data-list></tbody></table></div>`,
      foot: "Drawn from AOM 1.10.1, fully loaded condition. Outline simplified; dimensions as published."
    });
    const L = (k) => D[k][st.u === "ft" ? 0 : 1];
    function draw() {
      setSeg(el, "view", st.view); setSeg(el, "u", st.u);
      let svg = "";
      if (st.view === "plan") {
        svg = `<svg viewBox="-7 -42 101 92" role="img" aria-label="Plan view with dimensions">${arrowDefs("am")}
          <g transform="rotate(-90)">${topPlane("ac")}</g>
          ${vdim(-34.2, 34.2, 60, L("span"), 55.2, 55.2, "am", -18)}
          ${vdim(-11, 11, 81, L("stab"), 74.6, 74.6, "am", 0.7)}
          ${hdim(0, 74.2, 38, L("stabtip"), 0.5, 11.5, "am")}
          ${hdim(0, 76.3, 45, L("len"), 0.5, 0.5, "am")}</svg>`;
      } else if (st.view === "side") {
        svg = `<svg viewBox="-17 -23 110 33" role="img" aria-label="Side view with dimensions">${arrowDefs("am")}

        </div>

          <div class="deck" data-deck><div class="row"><span>Main deck ceiling lights</span><span class="horn" data-horn>HORNS</span></div><div class="ceil">${"<i></i>".repeat(10)}</div>

          <ul class="status" data-status></ul>

          <div><p class="lbl-sm">Event log</p><ul class="log" data-log></ul></div>
        </div></div>`,
      foot: "Logic from AOM 1.30.3, 1.30.16–17, 1.40.4, 1.40.13 and 1.45.1. Alerts last “several seconds”; shown here as 4 s. Masks stay presented after a reset until restowed."
    });
    el.querySelector('[data-sw="oxySw"]').dataset.guardpos = "NORM";
    const cab = el.querySelector("#ca-cab"), ac = el.querySelector("#ca-ac");
    const now = () => Date.now();
    function addLog(t) { log.unshift({ t, at: new Date() }); log = log.slice(0, 6); }
    function fsb() {
      if (st.oxyActive) return true;
      if (st.belts === "ON") return true;
      if (st.belts === "OFF") return false;
      return st.gear !== "UP" || st.flap !== "UP" || st.acAlt < 10300 || st.cabAlt > 10000;
    }
    function mainAlert(why) { alertUntil = now() + 4000; addLog(why + " → main deck lights flash, horns sound"); T(draw, 4050); }
    function deploy(why) {
      if (st.oxyActive) return;
      st.oxyActive = true; st.masks = true;
      addLog(why + " → supernumerary masks drop");
      if (st.tail === "15") { crewUntil = now() + 4000; crewSteady = false; addLog("JA15–18KZ: crew rest ceiling lights flash and a tone sounds"); T(draw, 4050); }
      else { lightsUntil = Math.max(lightsUntil, now() + 4000); crewSteady = true; addLog("JA11–14KZ: main deck ceiling lights flash, crew rest ceiling lights on"); T(draw, 4050); }
    }
    let lastFsb = null;
    function step(prev) {
      if (prev.cabAlt < 10000 && st.cabAlt >= 10000) mainAlert("Cabin altitude reached 10,000 ft");
      if (st.cabAlt >= 14000 && prev.cabAlt < 14000 && st.oxySw === "NORM") deploy("Cabin altitude reached ~14,000 ft");
      if (prev.smoke === "NO" && st.smoke === "YES") mainAlert("Smoke detected in main deck");
      const f = fsb();
      if (lastFsb !== null && f !== lastFsb) { toneUntil = now() + 1500; addLog(`FASTEN SEAT BELTS ${f ? "on" : "off"} → low tone over PA`); T(draw, 1550); }
      lastFsb = f;
    }
    function change(fn) { const prev = { ...st }; fn(); step(prev); draw(); }
    function draw() {
      const t = now();
      setSw(el, "belts", st.belts, SB); setSw(el, "oxySw", st.oxySw, OX);
      ["ag", "gear", "flap", "smoke", "tail"].forEach((k) => setSeg(el, k, st[k]));
      cab.value = st.cabAlt; ac.value = st.acAlt;
      el.querySelector("[data-cabv]").textContent = fmtAlt(st.cabAlt) + " ft";
      el.querySelector("[data-acv]").textContent = fmtAlt(st.acAlt) + " ft";
      const f = fsb(), r = f && !st.oxyActive;
      el.querySelector('[data-sign="fsb"]').classList.toggle("on", f);
      el.querySelector('[data-sign="rts"]').classList.toggle("on", r);
      const flashing = t < alertUntil || t < lightsUntil;
      el.querySelector("[data-deck]").classList.toggle("flash", flashing);
      el.querySelector("[data-horn]").classList.toggle("on", t < alertUntil);
      setPb(el, "mda", t < mdaUntil);
      el.querySelector("[data-pa]").textContent = t < toneUntil ? "PA: low tone ♪" : "PA: –";
      el.querySelector("[data-crew]").textContent = t < crewUntil ? "Crew rest: lights flashing, tone" : crewSteady && st.masks ? "Crew rest: ceiling lights on" : "Crew rest: –";
      const why = st.oxyActive ? "Oxygen deployed: on regardless of selector." : st.belts !== "AUTO" ? `Selector ${st.belts}.` :
        [st.gear !== "UP" && "gear not up and locked", st.flap !== "UP" && "flap lever not up", st.acAlt < 10300 && "airplane below 10,300 ft", st.cabAlt > 10000 && "cabin above 10,000 ft"].filter(Boolean).join(", ") || "No AUTO condition met.";
      const item = (n, c, cls, w) => `<li><span>${n}</span><span class="chip ${cls}">${c}</span>${w ? `<small>${w}</small>` : ""}</li>`;
      el.querySelector("[data-status]").innerHTML = [
        item("Seat belt signs", f ? (r ? "Both on" : "Belts only") : "Off", f ? "on" : "off", why),
        item("Supernumerary masks", st.masks ? "Presented" : "Stowed", st.masks ? "dim" : "off", st.masks ? (st.oxyActive ? "Flow starts when a mask or streamer is pulled down." : "Flow control unit closed by RESET.") : st.oxySw === "NORM" ? "Auto drop at about 14,000 ft cabin altitude." : ""),
        item("Flow control unit", st.oxyActive ? "Open" : "Closed", st.oxyActive ? "on" : "off")
      ].join("");
      const msgs = [];
      if (st.oxyActive) msgs.push(["SUPRNMRY OXY ON", "A"]);
      if (st.belts === "ON") msgs.push(["SEATBELTS ON", "M"]);
      if (st.belts === "OFF" && st.ag === "AIR") msgs.push(["SEATBELTS OFF", "M"]);
      el.querySelector("[data-msgs]").innerHTML = eicasList(orderMsgs(msgs));
      el.querySelector("[data-log]").innerHTML = log.length ? log.map((l, i) => `<li class="${i === 0 && t - l.at < 4000 ? "fresh" : ""}"><span class="mono">${l.at.toTimeString().slice(0, 8)}</span><span>${esc(l.t)}</span></li>`).join("") : `<li><span class="mono">–</span><span>Nothing yet. Drag the cabin altitude up.</span></li>`;
    }
    function stopAnim() { if (anim) { clearInterval(anim); anim = null; } }
    function animateTo(target, rate) {
      stopAnim();
      anim = setInterval(() => {
        change(() => { const d = target - st.cabAlt; st.cabAlt = Math.abs(d) <= rate ? target : st.cabAlt + Math.sign(d) * rate; });
        if (st.cabAlt === target) stopAnim();
      }, 100);
    }
    el.addEventListener("click", (e) => {
      const s = e.target.closest("[data-set]"), c = e.target.closest("[data-cycle]"), sg = e.target.closest("[data-seg]"), p = e.target.closest("[data-pb]"), a = e.target.closest("[data-a]");
      if (s || c) {
        const k = (s || c).dataset.set || (s || c).dataset.cycle;
        if (k === "belts") change(() => { const v = s ? s.dataset.v : SB[(SB.indexOf(st.belts) + 1) % 3]; if (v === "ON" && st.belts !== "ON") { lightsUntil = now() + 4000; addLog("SEATBELTS selected ON → main deck ceiling lights flash (no horns)"); T(draw, 4050); } st.belts = v; });
        if (k === "oxySw") {
          const v = s ? s.dataset.v : "ON";
          if (v === "NORM") return;
          st.oxySw = v; draw();
          if (v === "ON") change(() => { mainAlert("SUPRNMRY OXY switch ON"); deploy("SUPRNMRY OXY switch ON"); });
          if (v === "RESET") change(() => { if (st.cabAlt < 12000) { if (st.oxyActive) addLog("RESET below 12,000 ft → flow control unit closed"); else addLog("RESET: system not active"); st.oxyActive = false; } else addLog("RESET has no effect at or above 12,000 ft cabin altitude"); });
          T(() => { st.oxySw = "NORM"; draw(); }, 650);
        }
      } else if (sg) change(() => { st[sg.dataset.seg] = sg.dataset.v; if (sg.dataset.seg === "ag" && sg.dataset.v === "GROUND") { st.acAlt = 0; } });
      else if (p) change(() => { mdaUntil = now() + 4000; mainAlert("MAIN DECK ALERT pushed"); T(draw, 4050); });
      else if (a) { if (a.dataset.a === "depress") animateTo(25000, 700); else animateTo(8000, 400); }
    });
    cab.addEventListener("input", () => { stopAnim(); change(() => (st.cabAlt = +cab.value)); });
    ac.addEventListener("input", () => change(() => { st.acAlt = +ac.value; if (st.acAlt > 0 && st.ag === "GROUND") st.ag = "AIR"; }));
    lastFsb = fsb();
    draw();
    return () => { stopAnim(); timers.forEach(clearTimeout); };
  };

      { id: "entry", n: "ENTRY 1", msg: "DOOR ENTRY L1", lv: "A", shape: `<rect x="176" y="126" width="11" height="8"/>`, lab: [40, 134, "start"], tip: [176, 130] },
      { id: "upper", n: "UPPER DECK", msg: "DOOR R UPPER DK", lv: "A", shape: `<rect x="208" y="111" width="12" height="7"/>`, lab: [360, 118, "end"], tip: [220, 114] },
      { id: "fwd", n: "FWD CARGO", msg: "DOOR FWD CARGO", lv: "C", shape: `<rect x="206" y="142" width="16" height="16"/>`, lab: [360, 154, "end"], tip: [222, 150] },
      { id: "cel", n: "CTR ELEC", msg: "DOOR ELEC CTR", lv: "A", shape: `<rect x="195" y="222" width="10" height="10"/>`, lab: [360, 230, "end"], tip: [205, 227] },
      { id: "side", n: "SIDE CARGO", msg: "DOOR SIDE CARGO", lv: "C", shape: `<rect x="176" y="326" width="16" height="16"/>`, lab: [40, 338, "start"], tip: [176, 334] },
      { id: "aft", n: "AFT CARGO", msg: "DOOR AFT CARGO", lv: "C", shape: `<rect x="207" y="326" width="16" height="16"/>`, lab: [360, 338, "end"], tip: [223, 334] },
      { id: "bulk", n: "BULK CARGO", msg: "DOOR BULK CARGO", lv: "A", shape: `<rect x="210" y="350" width="10" height="10"/>`, lab: [360, 360, "end"], tip: [220, 355] }
    ];
    const open = new Set(), order = [];
    let mc = false, beepT = null;
    const lines = DOORS.map((d) => {

    }).join("");

      <path class="ol" d="M172,196 L58,298 M172,246 L104,272 M228,196 L342,298 M228,246 L296,272 M174,386 L140,410 M226,386 L260,410"/>
      ${lines}
      ${DOORS.map((d) => `<g class="door" data-door="${d.id}" role="button" tabindex="0" aria-label="${d.n}">${d.shape}</g>`).join("")}
    </svg>`;
    frame(el, "Doors synoptic and EICAS", {
      body: `<div class="wg-grid two"><div class="disp syn" style="padding:6px"><div class="disp-t" style="padding:4px 6px 0"><span>MFD · DRS</span><span>TAP A DOOR</span></div>${svg}</div>
        <div style="display:grid;gap:12px;align-content:start">
          <div class="mc"><button class="mcaution" data-mc aria-label="Master caution, push to reset">CAUTION</button><span class="beep" data-beep>♪ BEEPER</span></div>
          <div class="disp"><div class="disp-t"><span>UPPER EICAS</span><span>ALERTS</span></div><div class="msgs" data-msgs style="min-height:8em"></div></div>

    return { v: "home" };

  function go(h) { if (location.hash === "#" + h) render(); else location.hash = h; }

  /* ── chrome bar ── */
  function bar(r) {
    const t = S.get("theme", "system");
    const ti = t === "light" ? ICON.sun : t === "dark" ? ICON.moon : ICON.auto;
    const tl = t === "light" ? "Light" : t === "dark" ? "Dark" : "Auto";
    let crumb = "";
    if (r.v !== "home" && B.chapters[r.ch]) crumb = `<span class="crumb"><b>Ch ${r.ch}</b> · ${esc(B.chapters[r.ch].short)}${r.v === "quiz" ? " · Quiz" : ""}</span>`;
    return `<header class="bar">
      ${r.v === "sec" ? `<button class="ib only-narrow" data-act="drawer" aria-label="Sections">${ICON.menu}</button>` : ""}
      <a class="brand" href="#" aria-label="Home"><b>747-8F</b><span>Tech Guide</span></a>
      ${crumb}
      <span class="grow"></span>
      <button class="ib" data-act="search" aria-label="Search">${ICON.search}<span class="lbl">Search</span></button>
      ${r.v === "sec" ? `<a class="ib" href="#quiz-c${r.ch}" aria-label="Quiz">${ICON.quiz}<span class="lbl">Quiz</span></a>` : ""}
      <button class="ib" data-act="theme" aria-label="Theme: ${tl}" title="Theme: ${tl}">${ti}</button>
    </header>`;
  }

  /* ── home ── */
  function viewHome() {
    let secs = 0, done = 0, seen = 0, right = 0, missed = 0;
    Object.keys(B.chapters).forEach((n) => { const s = chapterStats(+n); secs += s.secs; done += s.done; seen += s.seen; right += s.right; missed += s.missed; });
    const loaded = Object.keys(B.chapters).length;
    const last = S.get("last", null);
    const lastSec = last && B.chapters[last.ch] && B.chapters[last.ch].sections.find((s) => s.id === last.sec);
    const cards = B.library.map((c) => {
      const ch = B.chapters[c.num];
      if (!ch) return `<div class="chap locked"><span class="n">${pad2(c.num)}</span><span class="t">${esc(c.title)}</span><span class="s">Waiting for source chapter</span></div>`;
      const s = chapterStats(c.num);
      return `<a class="chap" href="#c${c.num}"><span class="n">${pad2(c.num)}</span><span class="t">${esc(ch.title)}</span>
        <span class="s">${s.secs} sections · ${s.q} questions · ${s.done}/${s.secs} reviewed</span>
        <span class="meter"><i style="width:${Math.round((s.done / s.secs) * 100)}%"></i></span></a>`;
    }).join("");
    return `<main><section class="home-hero">
        <div><div class="eyebrow">Boeing 747-8 Freighter</div>
        <h1>Systems,<br><em>in depth.</em></h1>
        <p>A study guide built from your AOM, one chapter at a time. Interactive panels, the freighter-specific detail, and a question bank that brings back what you miss.</p></div>
        <div class="stats">
          <div class="stat"><b>${done}/${secs}</b><span>Sections reviewed</span></div>
          <div class="stat"><b>${seen ? Math.round((right / seen) * 100) + "%" : "–"}</b><span>Quiz accuracy, last attempt</span></div>
          <div class="stat"><b>${missed}</b><span>Questions to revisit</span></div>
        </div>
      </section>
      <div class="home-actions">
        ${lastSec ? `<a class="btn primary" href="#c${last.ch}-${last.sec}">Continue · ${esc(lastSec.title)}</a>` : `<a class="btn primary" href="#c1">Start Chapter 1</a>`}
        ${missed ? `<button class="btn" data-act="quiz-missed">Revisit ${missed} missed question${missed > 1 ? "s" : ""}</button>` : `<a class="btn" href="#quiz-c1">Take the Chapter 1 quiz</a>`}
      </div>
      <div class="grid-h"><h2>Chapters</h2><span>${loaded} of ${B.library.length} loaded</span></div>
      <div class="chapters">${cards}</div>
      <p class="disclaimer">Personal study aid, not approved data. The AOM and company procedures govern. Chapter 1 source: ${esc(B.chapters[1] ? B.chapters[1].source : "")}.</p>
    </main>`;
  }

  /* ── section rail ── */
  function rail(ch, cur) {
    const c = B.chapters[ch];
    const s = chapterStats(ch);
    const items = c.sections.map((x) => `<li><a href="#c${ch}-${x.id}" ${x.id === cur ? 'aria-current="page"' : ""}>
      <span class="nav-t">${esc(x.title)}</span><span class="tick ${isReviewed(ch, x.id) ? "done" : ""}" aria-label="${isReviewed(ch, x.id) ? "Reviewed" : "Not reviewed"}"></span>
      <span class="nav-r">${esc(x.ref)}</span></a></li>`).join("");
    return `<nav class="rail" aria-label="Sections"><h2>Chapter ${ch}</h2><div class="chap-t">${esc(c.title)}</div>
      <ul class="nav">${items}</ul>
      <a class="quiz-link" href="#quiz-c${ch}"><span>Chapter quiz</span><small>${s.seen}/${s.q} seen${s.missed ? " · " + s.missed + " to revisit" : ""}</small></a></nav>`;
  }

  /* ── blocks ── */
  function block(b, ctx) {
    switch (b.t) {
      case "p": return `<p>${fmt(b.html)}</p>`;
      case "h": return `<h3>${esc(b.text)}</h3>`;
      case "ul": return `<ul>${b.items.map((i) => `<li>${fmt(i)}</li>`).join("")}</ul>`;
      case "steps": return `<ol class="steps">${b.items.map((i) => `<li><span>${fmt(i)}</span></li>`).join("")}</ol>`;
      case "facts": return `<div class="facts">${b.items.map((f) => `<div class="fact"><b>${esc(f[0])}</b><span>${esc(f[1])}</span></div>`).join("")}</div>`;
      case "note": {
        const lab = { warning: "WARNING", caution: "CAUTION", note: "NOTE", fr: "FREIGHTER", eff: "EFFECTIVITY" }[b.k] || "NOTE";
        return `<div class="note ${b.k}"><span class="tag">${lab}</span><div class="txt">${fmt(b.html)}</div></div>`;
      }
      case "ctrl": {
        const single = b.pos.length === 1 && !b.pos[0][0];
        return `<div class="ctrl"><div class="ctrl-h"><span class="ctrl-n">${esc(b.name)}</span><span class="ctrl-w">${esc(b.where)}${b.ref ? ` · <span class="mono">${esc(b.ref)}</span>` : ""}</span></div>
          <dl class="pos ${single ? "single" : ""}">${b.pos.map((p) => (p[0] ? `<dt><span class="key">${esc(p[0])}</span></dt>` : "") + `<dd>${fmt(p[1])}</dd>`).join("")}</dl></div>`;
      }
      case "table": return `<div class="tbl-wrap"><table class="${b.cls || ""}"><thead><tr>${b.head.map((x) => `<th>${esc(x)}</th>`).join("")}</tr></thead>
        <tbody>${b.rows.map((r) => `<tr>${r.map((x) => `<td>${fmt(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      case "eicas": {
        const L = { Caution: "C", Advisory: "A", Warning: "W", Memo: "M" };
        const rows = b.rows.map((r) => `<div class="eicas-row" data-msg="${esc((r[0] + " " + r[1] + " " + r[3]).toLowerCase())}"><div class="eicas-m ${L[r[1]]}">${esc(r[0])}</div>
          <div class="eicas-l"><span class="lv">${esc(r[1])}${r[2] ? " · " + esc(r[2]) : ""}</span>${esc(r[3])}</div></div>`).join("");
        return `<div class="eicas"><div class="eicas-h"><span>EICAS MESSAGES</span>${b.filter ? `<input type="search" id="eicas-filter" placeholder="Filter" aria-label="Filter messages">` : ""}</div>${rows}</div>`;
      }
      case "widget": return `<figure class="wg" data-widget="${b.id}"></figure>`;
      default: return "";
    }
  }

  function viewSection(r) {
    const c = B.chapters[r.ch];
    const i = Math.max(0, c.sections.findIndex((s) => s.id === r.sec));
    const s = c.sections[i];
    S.set("last", { ch: r.ch, sec: s.id });
    const prev = c.sections[i - 1], next = c.sections[i + 1];
    const done = isReviewed(r.ch, s.id);
    return `<div class="shell has-rail">${rail(r.ch, s.id)}<main><article class="col">
      <header class="sec-head"><div class="ref">AOM ${esc(s.ref)} · Chapter ${r.ch}</div><h1>${esc(s.title)}</h1><p>${esc(s.summary)}</p></header>
      <div class="body">${s.blocks.map((b) => block(b, { ch: r.ch })).join("")}</div>
      <footer class="sec-foot">
        <div class="reviewed"><p>${done ? "Marked as reviewed." : "Finished this section?"}</p>
          <button class="btn ${done ? "" : "primary"}" data-act="review" data-sec="${s.id}">${done ? "Mark as not reviewed" : "Mark as reviewed"}</button></div>
        <div class="pn">${prev ? `<a class="prev" href="#c${r.ch}-${prev.id}"><small>Previous</small><b>${esc(prev.title)}</b></a>` : ""}
          ${next ? `<a class="next" href="#c${r.ch}-${next.id}"><small>Next</small><b>${esc(next.title)}</b></a>` : `<a class="next" href="#quiz-c${r.ch}"><small>Next</small><b>Chapter quiz</b></a>`}</div>
      </footer></article></main></div>`;
  }

  function mountWidgets(ch) {
    document.querySelectorAll("[data-widget]").forEach((el) => {
      const id = el.getAttribute("data-widget");
      const fn = W[id];
      if (!fn) { el.innerHTML = `<div class="wg-body">Interactive panel “${esc(id)}” is not available.</div>`; return; }
      try { const c = fn(el, { ch, go }); if (typeof c === "function") cleanups.push(c); }
      catch (e) { console.error(e); el.innerHTML = `<div class="wg-body">This interactive panel failed to load.</div>`; }
    });
    const f = document.getElementById("eicas-filter");
    if (f) f.addEventListener("input", () => {
      const q = f.value.trim().toLowerCase();
      f.closest(".eicas").querySelectorAll(".eicas-row").forEach((row) => { row.hidden = q && !row.dataset.msg.includes(q); });
    });
  }

  /* ── search ── */
  let index = null;
  function buildIndex() {
    index = [];
    Object.values(B.chapters).forEach((c) => c.sections.forEach((s) => {
      const parts = [s.title, s.summary];
      s.blocks.forEach((b) => {
        if (b.html) parts.push(b.html);
        if (b.text) parts.push(b.text);
        if (b.items) b.items.forEach((x) => parts.push(Array.isArray(x) ? x.join(" ") : x));
        if (b.name) parts.push(b.name, b.where || "");
        if (b.pos) b.pos.forEach((p) => parts.push(p[0] + " " + p[1]));
        if (b.rows) b.rows.forEach((r) => parts.push(r.join(" ")));
        if (b.head) parts.push(b.head.join(" "));
      });
      index.push({ ch: c.num, sec: s.id, title: s.title, ref: s.ref, text: strip(parts.join(" · ")) });
    }));
  }
  let pendingHit = null;
  function openSearch() {
    if (!index) buildIndex();
    const bg = document.createElement("div");
    bg.className = "search-bg";
    bg.innerHTML = `<div class="search" role="dialog" aria-label="Search"><div class="search-in">${ICON.search}
      <input id="q-input" type="search" placeholder="Search switches, lights, messages…" autocomplete="off" aria-label="Search"><button data-x>Close</button></div>
      <div class="results" id="q-res"><div class="res-empty">Try “lock-out”, “14,000”, “taxi”, “EMER LIGHTS”.</div></div></div>`;
    document.body.appendChild(bg);
    const inp = bg.querySelector("input"), res = bg.querySelector("#q-res");
    const close = () => { bg.remove(); document.removeEventListener("keydown", onKey); };
    const onKey = (e) => { if (e.key === "Escape") close(); };
    document.addEventListener("keydown", onKey);
    bg.addEventListener("click", (e) => { if (e.target === bg || e.target.closest("[data-x]")) close(); });
    inp.addEventListener("input", () => {
      const q = inp.value.trim();
      if (q.length < 2) { res.innerHTML = `<div class="res-empty">Type at least two characters.</div>`; return; }
      const ql = q.toLowerCase();
      const words = ql.split(/\s+/).filter(Boolean);
      const hits = index.map((e) => {
        const tl = e.text.toLowerCase();
        if (!words.every((w) => tl.includes(w))) return null;
        let n = 0, p = -1; while ((p = tl.indexOf(words[0], p + 1)) !== -1) n++;
        if (e.title.toLowerCase().includes(ql)) n += 10;
        return { e, n, at: tl.indexOf(words[0]) };
      }).filter(Boolean).sort((a, b) => b.n - a.n);
      if (!hits.length) { res.innerHTML = `<div class="res-empty">No matches for “${esc(q)}”.</div>`; return; }
      res.innerHTML = hits.slice(0, 30).map(({ e, at }) => {
        const st = Math.max(0, at - 60);
        let snip = (st > 0 ? "…" : "") + e.text.slice(st, at + 110) + "…";
        snip = esc(snip).replace(new RegExp("(" + words[0].replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig"), "<mark>$1</mark>");
        return `<a class="res" href="#c${e.ch}-${e.sec}" data-q="${esc(words[0])}"><small>Ch ${e.ch} · ${esc(e.ref)}</small><b>${esc(e.title)}</b><span>${snip}</span></a>`;
      }).join("");
    });
    res.addEventListener("click", (e) => { const a = e.target.closest("a.res"); if (a) { pendingHit = a.dataset.q; close(); if (a.getAttribute("href") === location.hash) { e.preventDefault(); render(); } } });
    setTimeout(() => inp.focus(), 30);
  }
  function highlight(q) {
    const root = document.querySelector("main .body"); if (!root || !q) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: (n) => n.parentElement.closest("[data-widget],script,style") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
    let node, first = null, count = 0;
    const ql = q.toLowerCase();
    const targets = [];
    while ((node = walker.nextNode())) if (node.nodeValue.toLowerCase().includes(ql)) targets.push(node);
    targets.forEach((n) => {
      if (count > 40) return;
      const i = n.nodeValue.toLowerCase().indexOf(ql);
      const r = document.createRange(); r.setStart(n, i); r.setEnd(n, i + q.length);
      const m = document.createElement("mark"); m.className = "hit"; r.surroundContents(m); count++;
      if (!first) first = m;
    });
    if (first) setTimeout(() => first.scrollIntoView({ block: "center" }), 60);
  }

  /* ── quiz ── */
  let QZ = null;
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function startQuiz(ch, mode, sec) {
    const c = B.chapters[ch]; const qs = qstats();
    let pool = c.quiz.slice();
    if (mode === "missed") pool = pool.filter((q) => qs[q.id] && !qs[q.id].last);
    if (mode === "sec") pool = pool.filter((q) => q.sec === sec);
    if (mode === "quick") {
      const w = (q) => { const s = qs[q.id]; return !s ? 2 : !s.last ? 3 : 1; };
      pool = shuffle(pool).sort((a, b) => w(b) - w(a)).slice(0, 10);
    }
    pool = shuffle(pool);
    QZ = { ch, mode, list: pool.map((q) => ({ q, order: shuffle(q.o.map((_, i) => i)) })), i: 0, picked: null, results: [] };
  }
  function viewQuiz(r) {
    const c = B.chapters[r.ch];
    if (!QZ || QZ.ch !== r.ch) return quizSetup(r.ch);
    if (QZ.i >= QZ.list.length) return quizResults();
    const it = QZ.list[QZ.i], q = it.q;
    const sec = c.sections.find((s) => s.id === q.sec);
    const answered = QZ.picked != null;
    const opts = it.order.map((oi, k) => {
      let cls = "";
      if (answered) { if (oi === q.a) cls = "right"; else if (oi === QZ.picked) cls = "wrong"; }
      return `<button class="opt ${cls}" data-act="answer" data-o="${oi}" ${answered ? "disabled" : ""}><span class="l">${"ABCD"[k]}</span><span>${esc(q.o[oi])}</span></button>`;
    }).join("");
    const ok = QZ.picked === q.a;
    return `<main><div class="qz">
      <div class="qz-top"><span class="mono">${QZ.i + 1} / ${QZ.list.length}</span><div class="prog"><i style="width:${(QZ.i / QZ.list.length) * 100}%"></i></div>
      <button class="btn" data-act="quiz-quit">End</button></div>
      <div class="qcard"><div class="qref">AOM ${esc(q.ref)} · ${esc(sec ? sec.title : "")}</div><h2>${esc(q.q)}</h2><div class="opts">${opts}</div>
      ${answered ? `<div class="why"><b style="color:var(${ok ? "--green" : "--red"})">${ok ? "Correct." : "Not quite."}</b><p>${esc(q.why)}</p>
        <div class="row"><a href="#c${r.ch}-${q.sec}" data-act="quiz-read">Read the section</a><button class="btn primary" data-act="next" id="qnext">${QZ.i + 1 < QZ.list.length ? "Next question" : "See results"}</button></div></div>` : ""}
      </div></div></main>`;
  }
  function quizSetup(ch) {
    const c = B.chapters[ch]; const s = chapterStats(ch);
    const opts = c.sections.map((x) => { const n = c.quiz.filter((q) => q.sec === x.id).length; return n ? `<option value="${x.id}">${esc(x.title)} (${n})</option>` : ""; }).join("");
    return `<main><div class="qz"><div class="eyebrow">Chapter ${ch} · Question bank</div>
      <h1 style="font-family:var(--f-display);font-size:var(--t-2xl);font-weight:800;margin-top:6px">${esc(c.short)} quiz</h1>
      <p style="color:var(--ink-2)">${c.quiz.length} questions, each tied to its AOM page. Questions you miss stay in the revisit pile until you get them right.</p>
      <div class="modes">
        <button class="mode" data-act="qstart" data-mode="quick"><b>Quick 10</b><span>Missed and unseen questions first</span></button>
        <button class="mode" data-act="qstart" data-mode="missed" ${s.missed ? "" : "disabled"}><b>Revisit missed</b><span>${s.missed ? s.missed + " waiting" : "Nothing to revisit yet"}</span></button>
        <button class="mode" data-act="qstart" data-mode="all"><b>Full bank</b><span>All ${c.quiz.length}, shuffled</span></button>
      </div>
      <div class="qsec"><p class="lbl-sm">One section</p><div style="display:flex;gap:8px;flex-wrap:wrap"><select id="qsec" aria-label="Section" style="flex:1;min-width:220px">${opts}</select>
        <button class="btn" data-act="qstart" data-mode="sec">Start</button></div></div>
      <p style="color:var(--ink-3);font-size:var(--t-sm);margin-top:26px">Seen ${s.seen} of ${s.q} · ${s.right} correct on last attempt. <button class="btn" data-act="qreset" style="min-height:34px;padding:4px 10px;margin-left:6px">Reset quiz history</button></p>
    </div></main>`;
  }
  function quizResults() {
    const n = QZ.results.length, ok = QZ.results.filter((x) => x.ok).length;
    const miss = QZ.results.filter((x) => !x.ok);
    return `<main><div class="qz"><div class="eyebrow">Result</div><div class="score" style="margin-top:8px">${ok}<span style="color:var(--ink-3);font-size:.5em">/${n}</span></div>
      <p style="color:var(--ink-2)">${n ? Math.round((ok / n) * 100) : 0}% correct.${miss.length ? " These are now in your revisit pile:" : " Clean sheet."}</p>
      ${miss.length ? `<ul class="missed">${miss.map((m) => `<li><b>${esc(m.q.q)}</b><small>${esc(m.q.o[m.q.a])} · <a href="#c${QZ.ch}-${m.q.sec}">AOM ${esc(m.q.ref)}</a></small></li>`).join("")}</ul>` : ""}
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:22px"><button class="btn primary" data-act="qagain">Another round</button><a class="btn" href="#c${QZ.ch}">Back to chapter</a></div></div></main>`;
  }
  function answer(oi) {
    if (!QZ || QZ.picked != null) return;
    const q = QZ.list[QZ.i].q; QZ.picked = oi;
    const ok = oi === q.a;
    QZ.results.push({ q, ok });
    const qs = qstats(); const s = qs[q.id] || { n: 0, c: 0 }; s.n++; if (ok) s.c++; s.last = ok ? 1 : 0; qs[q.id] = s; S.set("q", qs);
    render(true);
    const nb = document.getElementById("qnext"); if (nb) nb.focus({ preventScroll: true });
  }

  /* ── drawer ── */
  function openDrawer() {
    const r = route(); if (r.v !== "sec") return;
    const bg = document.createElement("div"); bg.className = "drawer-bg";
    const d = document.createElement("div"); d.className = "drawer";
    const c = B.chapters[r.ch];
    d.innerHTML = rail(r.ch, r.sec || c.sections[0].id);
    document.body.append(bg, d);
    const close = () => { bg.remove(); d.remove(); };
    bg.addEventListener("click", close);
    d.addEventListener("click", (e) => { if (e.target.closest("a")) close(); });
  }

  /* ── render ── */
  function render(keepScroll) {
    unmount();
    const r = route();
    if ((r.v === "sec" || r.v === "quiz") && !B.chapters[r.ch]) { location.hash = ""; return; }
    let html = bar(r);
    if (r.v === "home") html += viewHome();
    else if (r.v === "sec") html += viewSection(r);
    else html += viewQuiz(r);
    app.innerHTML = html;
    document.title = r.v === "home" ? "747-8F Tech Guide" : r.v === "quiz" ? "Quiz · Ch " + r.ch + " · 747-8F Tech Guide" : (B.chapters[r.ch].sections.find((s) => s.id === r.sec) || B.chapters[r.ch].sections[0]).title + " · 747-8F Tech Guide";
    if (r.v === "sec") mountWidgets(r.ch);
    if (!keepScroll) window.scrollTo(0, 0);
    if (pendingHit && r.v === "sec") { const q = pendingHit; pendingHit = null; highlight(q); }
  }

  /* ── events ── */
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-act]"); if (!t) return;
    const act = t.dataset.act, r = route();
    if (act === "theme") { const cur = S.get("theme", "system"); const nx = THEMES[(THEMES.indexOf(cur) + 1) % 3]; S.set("theme", nx); applyTheme(nx); render(true); }
    else if (act === "search") openSearch();
    else if (act === "drawer") openDrawer();
    else if (act === "review") { setReviewed(r.ch, t.dataset.sec, !isReviewed(r.ch, t.dataset.sec)); render(true); }
    else if (act === "qstart") { const sel = document.getElementById("qsec"); startQuiz(r.ch, t.dataset.mode, sel && sel.value); render(); }
    else if (act === "answer") answer(+t.dataset.o);
    else if (act === "next") { QZ.i++; QZ.picked = null; render(); }
    else if (act === "quiz-quit") { if (QZ && QZ.results.length) { QZ.i = QZ.list.length; } else QZ = null; render(); }
    else if (act === "qagain") { QZ = null; render(); }
    else if (act === "qreset") { const c = B.chapters[r.ch]; const qs = qstats(); c.quiz.forEach((q) => delete qs[q.id]); S.set("q", qs); render(true); }
    else if (act === "quiz-missed") { startQuiz(1, "missed"); go("quiz-c1"); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input,select,textarea")) return;
    if ((e.key === "/" || (e.key === "k" && (e.metaKey || e.ctrlKey))) && !document.querySelector(".search-bg")) { e.preventDefault(); openSearch(); return; }
    const r = route();
    if (r.v === "quiz" && QZ && QZ.i < QZ.list.length) {
      if (QZ.picked == null && /^[1-4]$/.test(e.key)) { const it = QZ.list[QZ.i]; const oi = it.order[+e.key - 1]; if (oi != null) answer(oi); }
    }
  });
  window.addEventListener("hashchange", () => render());

  /* ── offline install (only in the hosted build) ── */
  if (window.B748_PWA && "serviceWorker" in navigator) {
    let reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (reloading) location.reload(); });
    navigator.serviceWorker.register("sw.js").then((reg) => {
      reg.addEventListener("updatefound", () => {
        const nw = reg.installing; if (!nw) return;
        nw.addEventListener("statechange", () => {
          if (nw.state === "installed" && navigator.serviceWorker.controller) {
            const t = document.createElement("div"); t.className = "toast";
            t.innerHTML = `<span>A new version is ready.</span><button>Reload</button>`;
            t.querySelector("button").onclick = () => { reloading = true; (reg.waiting || nw).postMessage("skip"); };
            document.body.appendChild(t);
          }
        });
      });
    }).catch(() => {});
  }

  render();
})();

</script>
