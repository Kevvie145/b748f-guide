<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>747-8F Tech Guide</title>
<meta name="theme-color" content="#16212b">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="748F Guide">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=B612+Mono:wght@400;700&family=Sofia+Sans+Condensed:wght@500;600;700;800&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light; }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* 747-8F Tech Guide
   Layout: app shell — sticky chrome bar, section rail on wide screens, one reading column;
   interactive panels break out wider than the text column. */
:root {
  --bg: #edf0f2;
  --surface: #ffffff;
  --surface-2: #f5f7f9;
  --sunk: #e4e9ed;
  --ink: #15202a;
  --ink-2: #4b5966;
  --ink-3: #75828e;
  --line: #d3dae0;
  --line-2: #e3e8ec;
  --accent: #006f88;
  --accent-2: #00576b;
  --accent-soft: #d9edf2;
  --accent-ink: #ffffff;
  --chrome: #16212b;
  --chrome-2: #22303c;
  --chrome-ink: #e9eff4;
  --chrome-dim: #93a3b1;
  --amber: #955500;
  --amber-bg: #fcefd8;
  --red: #b3261e;
  --red-bg: #fbe2df;
  --green: #1c7a3c;
  --green-bg: #dcf0e3;
  --violet: #5646b5;
  --violet-bg: #ebe8fb;
  /* physical panel + display glass: same in both themes */
  --panel: #4a535a;
  --panel-hi: #5b646b;
  --panel-lo: #383f45;
  --panel-ink: #f1f4f6;
  --panel-dim: #a9b3bb;
  --glass: #05090c;
  --d-cyan: #43d6f2;
  --d-amber: #ffb21f;
  --d-white: #edf2f5;
  --d-green: #41e07b;
  --d-red: #ff4d40;
  --d-blue: #3d8bff;
  --d-dim: #34414b;
  --night: #0b1a26;
  --shadow: 0 1px 2px rgba(20, 32, 42, .06), 0 4px 16px rgba(20, 32, 42, .06);

  --f-display: "Sofia Sans Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "B612 Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --t-xs: 0.78rem; --t-sm: 0.88rem; --t-md: 1.0625rem; --t-lg: 1.25rem; --t-xl: 1.6rem; --t-2xl: 2.15rem; --t-3xl: 3rem;
  --bar-h: 56px;
  --rail-w: 290px;
  --read: 44rem;
  --wide: 60rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1015; --surface: #131a21; --surface-2: #172029; --sunk: #0e141a;
    --ink: #e3eaf0; --ink-2: #a2afba; --ink-3: #71808c; --line: #26313b; --line-2: #1d2730;
    --accent: #4fcbe4; --accent-2: #86dff0; --accent-soft: #10303a; --accent-ink: #04161c;
    --chrome: #070b0f; --chrome-2: #141c24; --chrome-ink: #dfe7ee; --chrome-dim: #7d8d9a;
    --amber: #ffbb52; --amber-bg: #33240c; --red: #ff7468; --red-bg: #3a1714;
    --green: #5bd78d; --green-bg: #10301d; --violet: #ab9fff; --violet-bg: #221d41;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1015; --surface: #131a21; --surface-2: #172029; --sunk: #0e141a;
  --ink: #e3eaf0; --ink-2: #a2afba; --ink-3: #71808c; --line: #26313b; --line-2: #1d2730;
  --accent: #4fcbe4; --accent-2: #86dff0; --accent-soft: #10303a; --accent-ink: #04161c;
  --chrome: #070b0f; --chrome-2: #141c24; --chrome-ink: #dfe7ee; --chrome-dim: #7d8d9a;
  --amber: #ffbb52; --amber-bg: #33240c; --red: #ff7468; --red-bg: #3a1714;
  --green: #5bd78d; --green-bg: #10301d; --violet: #ab9fff; --violet-bg: #221d41;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: var(--t-md); line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--chrome); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── chrome bar ── */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  height: var(--bar-h); background: var(--chrome); color: var(--chrome-ink);
  display: flex; align-items: center; gap: 6px;
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px));
}
.bar .brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: inherit; padding: 6px 8px; border-radius: 6px; min-width: 0; }
.brand b { font-family: var(--f-display); font-weight: 800; font-size: 1.32rem; letter-spacing: .02em; }
.brand span { font-family: var(--f-display); font-weight: 500; font-size: .95rem; letter-spacing: .12em; text-transform: uppercase; color: var(--chrome-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .crumb { font-family: var(--f-display); font-size: 1rem; letter-spacing: .04em; color: var(--chrome-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.bar .crumb b { color: var(--chrome-ink); font-weight: 600; }
.bar .grow { flex: 1; }
.brand b { white-space: nowrap; }
@media (max-width: 640px) { .bar .crumb { display: none; } }
@media (max-width: 400px) { .brand span { display: none; } }
.ib {
  height: 40px; min-width: 40px; padding: 0 10px; border-radius: 8px; border: 1px solid transparent;
  background: transparent; color: var(--chrome-ink); display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-family: var(--f-display); font-size: .95rem; letter-spacing: .06em; text-transform: uppercase;
}
.ib:hover { background: var(--chrome-2); }
.ib svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ib .lbl { display: none; }
@media (min-width: 720px) { .ib .lbl { display: inline; } }
.only-narrow { display: inline-flex; }
@media (min-width: 1000px) { .only-narrow { display: none; } }

/* ── shell ── */
.shell { display: grid; grid-template-columns: 1fr; min-height: calc(100vh - var(--bar-h)); }
@media (min-width: 1000px) { .shell.has-rail { grid-template-columns: var(--rail-w) minmax(0, 1fr); } }
.rail {
  display: none; background: var(--surface); border-right: 1px solid var(--line);
  position: sticky; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--bar-h) - env(safe-area-inset-top, 0px)); overflow-y: auto;
  padding: 18px 12px 28px max(12px, env(safe-area-inset-left, 0px));
}
@media (min-width: 1000px) { .shell.has-rail .rail { display: block; } }
.rail h2 { font-family: var(--f-display); font-size: .82rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); padding: 0 10px 8px; }
.rail .chap-t { padding: 0 10px 14px; font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; line-height: 1.2; }
.nav { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.nav a {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center;
  padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--ink);
}
.nav a:hover { background: var(--surface-2); }
.nav a[aria-current="page"] { background: var(--accent-soft); }
.nav a[aria-current="page"] .nav-t { color: var(--accent-2); font-weight: 700; }
.nav-t { font-size: .97rem; line-height: 1.25; }
.nav-r { grid-column: 1; font-family: var(--f-mono); font-size: .7rem; color: var(--ink-3); }
.nav .tick { grid-row: 1 / span 2; grid-column: 2; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; }
.nav .tick.done { background: var(--green); border-color: var(--green); }
.nav .tick.done::after { content: ""; width: 8px; height: 4px; border-left: 2px solid var(--surface); border-bottom: 2px solid var(--surface); transform: rotate(-45deg) translate(1px, -1px); }
.rail .quiz-link { margin: 18px 4px 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; border-radius: 10px; background: var(--chrome); color: var(--chrome-ink); text-decoration: none; font-family: var(--f-display); letter-spacing: .06em; text-transform: uppercase; font-size: .95rem; }
.rail .quiz-link small { font-family: var(--f-mono); font-size: .72rem; color: var(--chrome-dim); letter-spacing: 0; text-transform: none; }

/* drawer on narrow screens */
.drawer-bg { position: fixed; inset: 0; background: rgba(5, 10, 14, .45); z-index: 40; }
.drawer {
  position: fixed; z-index: 41; top: 0; bottom: 0; left: 0; width: min(88vw, 340px); background: var(--surface);
  overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 12px calc(24px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  box-shadow: 8px 0 30px rgba(0,0,0,.25);
}
.drawer .rail { display: block; position: static; height: auto; border: 0; padding: 0; }

main { min-width: 0; padding-block: 24px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 720px) { main { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); padding-top: 36px; } }
.col { max-width: var(--wide); margin-inline: auto; }
.col > .sec-head, .col > .sec-foot, .body > * { max-width: var(--read); margin-inline: auto; }
.body > .wg { max-width: none; }
.col-wide { max-width: var(--wide); margin-inline: auto; }

/* ── home ── */
.home-hero { max-width: var(--wide); margin: 0 auto 28px; display: grid; gap: 18px; }
@media (min-width: 820px) { .home-hero { grid-template-columns: 1.3fr 1fr; align-items: end; } }
.eyebrow { font-family: var(--f-display); font-size: .85rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3); }
.home-hero h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(2.6rem, 7vw, 4.4rem); line-height: .95; letter-spacing: -.01em; }
.home-hero h1 em { font-style: normal; color: var(--accent); }
.home-hero p { margin: 10px 0 0; color: var(--ink-2); max-width: 34rem; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.stat { padding: 14px 16px; border-right: 1px solid var(--line-2); }
.stat:last-child { border-right: 0; }
.stat b { display: block; font-family: var(--f-mono); font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat span { font-size: var(--t-xs); color: var(--ink-3); line-height: 1.3; display: block; }
.home-actions { max-width: var(--wide); margin: 0 auto 32px; display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; font-weight: 700; font-size: .97rem;
}
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn small { font-weight: 400; opacity: .8; }
.grid-h { max-width: var(--wide); margin: 0 auto 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.grid-h h2 { font-family: var(--f-display); font-size: var(--t-xl); font-weight: 700; }
.grid-h span { font-size: var(--t-sm); color: var(--ink-3); }
.chapters { max-width: var(--wide); margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.chap {
  display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: start; text-decoration: none; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-height: 92px;
}
a.chap:hover { border-color: var(--accent); }
.chap .n { grid-row: 1 / span 2; font-family: var(--f-mono); font-size: 1.5rem; font-weight: 700; color: var(--accent); line-height: 1; padding-top: 2px; }
.chap .t { font-family: var(--f-display); font-weight: 700; font-size: 1.12rem; line-height: 1.15; }
.chap .s { font-size: var(--t-xs); color: var(--ink-3); }
.chap .meter { grid-column: 2; height: 4px; border-radius: 2px; background: var(--sunk); overflow: hidden; margin-top: 6px; }
.chap .meter i { display: block; height: 100%; background: var(--green); }
.chap.locked { background: transparent; border-style: dashed; }
.chap.locked .n { color: var(--ink-3); }
.chap.locked .t { color: var(--ink-2); font-weight: 600; }
.disclaimer { max-width: var(--wide); margin: 36px auto 0; font-size: var(--t-sm); color: var(--ink-3); border-top: 1px solid var(--line); padding-top: 16px; }

/* ── section ── */
.sec-head { margin-bottom: 26px; }
.sec-head .ref { font-family: var(--f-mono); font-size: .8rem; color: var(--accent); letter-spacing: .02em; }
.sec-head h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(2rem, 5vw, 2.9rem); line-height: 1.02; margin-top: 6px; letter-spacing: -.005em; }
.sec-head p { margin: 12px 0 0; color: var(--ink-2); font-size: 1.12rem; }
.body > * + * { margin-top: 18px; }
.body h3 {
  font-family: var(--f-display); font-weight: 700; font-size: 1.45rem; line-height: 1.15; margin-top: 40px;
  padding-top: 14px; border-top: 1px solid var(--line);
}
.body p { margin-bottom: 0; }
.body ul, .body ol { padding-left: 1.25em; margin-bottom: 0; }
.body li + li { margin-top: 6px; }
.body li::marker { color: var(--ink-3); }
.nm { font-family: var(--f-display); font-weight: 700; letter-spacing: .05em; font-size: .96em; }
.ei { font-family: var(--f-mono); font-size: .86em; background: var(--glass); color: var(--d-amber); padding: 1px 5px; border-radius: 3px; white-space: nowrap; }
mark, .hit { background: #ffe58a; color: #1b1400; border-radius: 2px; padding: 0 1px; }

.steps { list-style: none; padding: 0 !important; counter-reset: st; display: grid; gap: 8px; }
.steps li { counter-increment: st; display: grid; grid-template-columns: 2rem 1fr; gap: 10px; margin: 0 !important; }
.steps li::before { content: counter(st); font-family: var(--f-mono); font-size: .8rem; font-weight: 700; width: 1.7rem; height: 1.7rem; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); color: var(--ink-2); margin-top: 1px; }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.fact { background: var(--surface); padding: 12px 14px; }
.fact b { display: block; font-family: var(--f-mono); font-size: 1.28rem; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.fact span { display: block; font-size: var(--t-xs); color: var(--ink-3); line-height: 1.3; margin-top: 3px; }

.note { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line-2); }
.note .tag { font-family: var(--f-display); font-size: .78rem; font-weight: 800; letter-spacing: .14em; padding: 3px 7px 2px; border-radius: 4px; margin-top: 2px; white-space: nowrap; }
.note.warning { background: var(--red-bg); border-color: transparent; }
.note.warning .tag { background: var(--red); color: var(--surface); }
.note.warning .txt, .note.caution .txt { font-weight: 700; }
.note.caution { background: var(--amber-bg); border-color: transparent; }
.note.caution .tag { background: var(--amber); color: var(--surface); }
.note.note .tag { border: 1.5px solid var(--ink-2); color: var(--ink-2); }
.note.fr { background: var(--accent-soft); border-color: transparent; }
.note.fr .tag { background: var(--accent); color: var(--accent-ink); }
.note.eff { background: var(--violet-bg); border-color: transparent; }
.note.eff .tag { background: var(--violet); color: var(--surface); }

.ctrl { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.ctrl-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; padding: 10px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line-2); }
.ctrl-n { font-family: var(--f-display); font-weight: 700; font-size: 1.12rem; letter-spacing: .02em; }
.ctrl-w { font-size: var(--t-xs); color: var(--ink-3); }
.ctrl-w .mono { color: var(--accent); }
.pos { margin: 0; display: grid; grid-template-columns: minmax(84px, max-content) 1fr; }
.pos dt, .pos dd { padding: 10px 14px; border-top: 1px solid var(--line-2); margin: 0; }
.pos dt:first-of-type, .pos dt:first-of-type + dd { border-top: 0; }
.pos dd { padding-left: 0; }
.key { display: inline-block; font-family: var(--f-display); font-weight: 700; font-size: .84rem; letter-spacing: .06em; text-transform: uppercase; background: var(--panel); color: var(--panel-ink); padding: 3px 8px 2px; border-radius: 4px; line-height: 1.25; }
.pos.single { grid-template-columns: 1fr; }
.pos.single dd { padding-left: 14px; }
@media (max-width: 520px) { .pos { grid-template-columns: 1fr; } .pos dd { padding: 0 14px 12px; border-top: 0; } .pos dt { padding-bottom: 6px; } }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .97rem; }
th { text-align: left; font-family: var(--f-display); font-weight: 700; font-size: .82rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); background: var(--surface-2); }
th, td { padding: 9px 14px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
table.num td:last-child { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* EICAS table */
.eicas { background: var(--glass); border-radius: 12px; overflow: hidden; color: var(--d-white); }
.eicas-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #16212a; }
.eicas-h span { font-family: var(--f-display); font-size: .8rem; font-weight: 700; letter-spacing: .16em; color: #7f909d; }
.eicas-h input { background: #0e171e; border: 1px solid #22313c; border-radius: 6px; color: var(--d-white); padding: 6px 10px; font-family: var(--f-mono); font-size: .82rem; width: min(220px, 50vw); }
.eicas-row { display: grid; grid-template-columns: minmax(11rem, 14rem) 1fr; gap: 4px 16px; padding: 10px 14px; border-top: 1px solid #111b23; }
.eicas-row:first-of-type { border-top: 0; }
.eicas-m { font-family: var(--f-mono); font-size: .95rem; letter-spacing: .02em; }
.eicas-m.C { color: var(--d-amber); }
.eicas-m.A { color: var(--d-amber); padding-left: 1ch; }
.eicas-m.W { color: var(--d-red); }
.eicas-m.M { color: var(--d-white); }
.eicas-l { font-size: .92rem; color: #c3ced6; }
.eicas-l .lv { font-family: var(--f-display); font-size: .76rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #7f909d; margin-right: 8px; }
@media (max-width: 560px) { .eicas-row { grid-template-columns: 1fr; } }

/* section footer */
.sec-foot { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); display: grid; gap: 14px; }
.reviewed { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.reviewed p { margin: 0; color: var(--ink-2); font-size: var(--t-sm); }
.pn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pn a { display: grid; gap: 2px; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.pn a:hover { border-color: var(--accent); }
.pn a.next { text-align: right; grid-column: 2; }
.pn small { font-family: var(--f-display); font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.pn b { font-family: var(--f-display); font-size: 1.1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── widgets ── */
.wg { container-type: inline-size; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.wg-cap { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.wg-tag { font-family: var(--f-display); font-size: .74rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.wg-t { font-family: var(--f-display); font-weight: 700; font-size: 1.12rem; }
.wg-tools { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.wg-body { padding: 14px; }
.wg-foot { margin: 0; padding: 10px 14px 12px; font-size: var(--t-xs); color: var(--ink-3); border-top: 1px solid var(--line-2); }
.wg-grid { display: grid; gap: 14px; align-items: start; }
.wg-grid > div { align-content: start; }
@container (min-width: 680px) { .wg-grid.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .wg-grid.l { grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); } }
.fig-scroll { overflow-x: auto; }
.fig-scroll svg { display: block; width: 100%; min-width: 600px; height: auto; }
.lbl-sm { font-family: var(--f-display); font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 6px; }

/* app-styled segmented control */
.seg { display: inline-flex; background: var(--sunk); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 11px; border-radius: 7px; font-size: .88rem; font-weight: 700; color: var(--ink-2); min-height: 34px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.conds { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.cond { display: grid; gap: 4px; }
.cond > span { font-size: var(--t-xs); color: var(--ink-3); font-weight: 700; }
.range { display: grid; gap: 4px; }
.range label { display: flex; justify-content: space-between; gap: 10px; font-size: var(--t-xs); color: var(--ink-3); font-weight: 700; }
.range label b { font-family: var(--f-mono); font-size: .9rem; color: var(--ink); }
.range input { width: 100%; accent-color: var(--accent); }

/* physical panel */
.pnl { background: var(--panel); color: var(--panel-ink); border-radius: 10px; padding: 14px; box-shadow: inset 0 1px 0 var(--panel-hi), inset 0 -1px 0 var(--panel-lo); position: relative; }
.pnl-t { font-family: var(--f-display); font-weight: 700; font-size: .8rem; letter-spacing: .16em; text-transform: uppercase; color: var(--panel-ink); text-align: center; margin: 0 0 12px; }
.pnl-row { display: flex; flex-wrap: wrap; gap: 14px 18px; justify-content: center; align-items: flex-start; }
.pnl-sep { border-top: 1px solid var(--panel-lo); box-shadow: 0 1px 0 var(--panel-hi); margin: 14px 0; }
.pnl-grp { border: 1px solid #6c757c; border-radius: 6px; padding: 8px 10px 10px; display: grid; gap: 8px; justify-items: center; }
.pnl-grp > .gl { font-family: var(--f-display); font-size: .74rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }

/* toggle switch */
.sw { display: grid; justify-items: center; gap: 6px; min-width: 56px; }
.sw-l { font-family: var(--f-display); font-weight: 700; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; text-align: center; line-height: 1.1; }
.sw-b { display: flex; gap: 6px; align-items: stretch; }
.sw-track { width: 18px; border-radius: 9px; background: var(--panel-lo); box-shadow: inset 0 1px 3px rgba(0,0,0,.5); position: relative; border: 0; padding: 0; }
.sw-bat { position: absolute; left: 50%; width: 14px; height: 22px; margin-left: -7px; border-radius: 5px; background: linear-gradient(#f4f6f7, #b8c0c6); box-shadow: 0 2px 3px rgba(0,0,0,.45); transition: top .12s ease; }
.sw-pos { display: grid; gap: 2px; }
.sw-pos button { border: 0; background: transparent; color: var(--panel-dim); font-family: var(--f-display); font-weight: 700; font-size: .76rem; letter-spacing: .08em; text-transform: uppercase; padding: 3px 4px; border-radius: 4px; text-align: left; min-height: 26px; line-height: 1; }
.sw-pos button[aria-pressed="true"] { color: var(--panel-ink); background: rgba(255,255,255,.1); }
.sw.guard .sw-track { outline: 2px solid #d9433a; outline-offset: 2px; }

/* lamps and lights */
.lamp { display: grid; justify-items: center; gap: 5px; min-width: 64px; }
.lamp i { width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #333c43, #12181c 70%); box-shadow: inset 0 0 0 2px #2a3136, 0 0 0 2px #6b747a; display: block; transition: background .15s, box-shadow .15s; }
.lamp span { font-family: var(--f-display); font-size: .74rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; text-align: center; line-height: 1.1; }
.lamp.on[data-c="green"] i { background: radial-gradient(circle at 40% 35%, #c9ffd9, #2fd46a 55%, #138a3f); box-shadow: 0 0 14px 2px rgba(60,230,120,.55), 0 0 0 2px #6b747a; }
.lamp.on[data-c="white"] i { background: radial-gradient(circle at 40% 35%, #ffffff, #e8eef2 55%, #b7c1c8); box-shadow: 0 0 14px 2px rgba(255,255,255,.5), 0 0 0 2px #6b747a; }
.lamp.on[data-c="blue"] i { background: radial-gradient(circle at 40% 35%, #cfe2ff, #3d8bff 55%, #1c4fb8); box-shadow: 0 0 14px 2px rgba(70,140,255,.6), 0 0 0 2px #6b747a; }
.lamp.on[data-c="amber"] i { background: radial-gradient(circle at 40% 35%, #fff0c8, #ffb21f 55%, #b76f00); box-shadow: 0 0 14px 2px rgba(255,178,31,.55), 0 0 0 2px #6b747a; }
.lamp.on[data-c="red"] i { background: radial-gradient(circle at 40% 35%, #ffd0cb, #ff4d40 55%, #a3160c); box-shadow: 0 0 14px 2px rgba(255,77,64,.55), 0 0 0 2px #6b747a; }

/* push buttons and hold switches */
.pb { border: 0; padding: 0; background: transparent; display: grid; justify-items: center; gap: 5px; color: var(--panel-ink); }
.pb .face { min-width: 64px; height: 44px; border-radius: 6px; background: #20272c; box-shadow: inset 0 0 0 2px #11171b, 0 2px 0 #11171b, 0 0 0 2px #6b747a; display: grid; place-items: center; padding: 4px 8px; font-family: var(--f-display); font-weight: 800; font-size: .78rem; letter-spacing: .08em; color: #59636a; text-transform: uppercase; line-height: 1.05; text-align: center; }
.pb:active .face, .pb.down .face { transform: translateY(1px); box-shadow: inset 0 0 0 2px #11171b, 0 1px 0 #11171b, 0 0 0 2px #6b747a; }
.pb.on .face { color: #fff; }
.pb.on[data-c="red"] .face { background: #a3160c; box-shadow: 0 0 14px rgba(255,77,64,.5), inset 0 0 0 2px #5a0b05, 0 0 0 2px #6b747a; }
.pb.on[data-c="white"] .face { color: #fff; text-shadow: 0 0 8px rgba(255,255,255,.8); }
.pb.on[data-c="amber"] .face { color: var(--d-amber); text-shadow: 0 0 8px rgba(255,178,31,.7); }
.pb.on[data-c="green"] .face { color: var(--d-green); text-shadow: 0 0 8px rgba(65,224,123,.7); }
.pb > span { font-family: var(--f-display); font-size: .74rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; text-align: center; line-height: 1.1; }
.hold { display: grid; gap: 4px; justify-items: center; }
.hold .hl { font-family: var(--f-display); font-size: .74rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.hold-b { display: grid; gap: 4px; }
.hold-b button { border: 0; min-width: 96px; min-height: 40px; border-radius: 6px; background: #2a3237; color: var(--panel-dim); font-family: var(--f-display); font-weight: 800; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; box-shadow: inset 0 0 0 1px #1a2025, 0 2px 0 #1a2025; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.hold-b button.held { background: #e9edf0; color: #1d2328; box-shadow: inset 0 0 0 1px #1a2025; transform: translateY(1px); }
.hold-mode { display: flex; align-items: center; gap: 8px; font-size: var(--t-xs); color: var(--ink-2); }
.hold-mode input { width: 18px; height: 18px; accent-color: var(--accent); }

/* display glass */
.disp { background: var(--glass); border-radius: 10px; padding: 12px; color: var(--d-white); font-family: var(--f-mono); position: relative; box-shadow: inset 0 0 0 3px #1b2329; }
.disp-t { font-family: var(--f-mono); font-size: .72rem; color: #6d7d89; letter-spacing: .08em; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; }
.disp .msgs { display: grid; gap: 2px; min-height: 5.5em; font-size: .95rem; }
.disp .msgs .C, .disp .msgs .A { color: var(--d-amber); }
.disp .msgs .A { padding-left: 1ch; }
.disp .msgs .W { color: var(--d-red); }
.disp .msgs .M { color: var(--d-white); }
.disp .msgs .none { color: #3e4b55; }
.disp.dead { background: #0c1114; }
.disp.dead .msgs { visibility: hidden; }
.disp.dead::after { content: "DISPLAY UNPOWERED"; position: absolute; inset: 0; display: grid; place-items: center; font-size: .78rem; color: #36434c; letter-spacing: .12em; }
.mc { display: flex; gap: 8px; }

/* status list */
.status { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.status li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); margin: 0 !important; }
.status li small { grid-column: 1 / -1; color: var(--ink-3); font-size: var(--t-xs); line-height: 1.35; }
.chip { font-family: var(--f-display); font-weight: 800; font-size: .74rem; letter-spacing: .12em; padding: 3px 8px 2px; border-radius: 5px; text-transform: uppercase; white-space: nowrap; }
.chip.on { background: var(--green-bg); color: var(--green); }
.chip.dim { background: var(--amber-bg); color: var(--amber); }
.chip.off { background: var(--sunk); color: var(--ink-3); }
.chip.inh { background: var(--violet-bg); color: var(--violet); }
.chip.warn { background: var(--red-bg); color: var(--red); }

.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: var(--t-sm); }
.log li { display: grid; grid-template-columns: auto 1fr; gap: 8px; padding: 6px 10px; border-radius: 8px; background: var(--surface-2); margin: 0 !important; }
.log li .mono { color: var(--ink-3); font-size: .74rem; padding-top: 2px; }
.log li.fresh { background: var(--amber-bg); }

/* night scene for the exterior lights view */
.night { background: radial-gradient(ellipse at 50% 30%, #12283a, var(--night) 70%); border-radius: 10px; }
@keyframes blink { 0%, 12% { opacity: 1; } 13%, 100% { opacity: .08; } }
@keyframes blink2 { 0%, 8% { opacity: 1; } 9%, 18% { opacity: .1; } 19%, 26% { opacity: 1; } 27%, 100% { opacity: .1; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
.fl-strobe { animation: blink2 1.3s infinite; }
.fl-beacon { animation: blink 1.1s infinite; }
.fl-alert { animation: pulse .5s infinite; }
@media (prefers-reduced-motion: reduce) { .fl-strobe, .fl-beacon, .fl-alert { animation: none; } .sw-bat { transition: none; } }

/* synoptic */
.syn svg { display: block; width: 100%; height: auto; max-height: 560px; }
.syn .door { cursor: pointer; }
.syn .door rect, .syn .door polygon { fill: transparent; stroke: transparent; stroke-width: 2; }
.syn .door.open rect, .syn .door.open polygon { fill: rgba(255,178,31,.08); stroke: var(--d-amber); }
.syn .door:hover rect, .syn .door:hover polygon { stroke: #5a6a75; }
.syn .door.open:hover rect, .syn .door.open:hover polygon { stroke: var(--d-amber); }
.doorlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.doorlist button { display: flex; align-items: center; justify-content: space-between; gap: 6px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; font-size: .86rem; font-weight: 700; min-height: 38px; }
.doorlist button[aria-pressed="true"] { border-color: var(--amber); background: var(--amber-bg); }
.doorlist button i { font-style: normal; font-family: var(--f-display); font-size: .7rem; letter-spacing: .1em; color: var(--ink-3); }
.doorlist button[aria-pressed="true"] i { color: var(--amber); }
.mcaution { border: 0; border-radius: 6px; padding: 6px 10px; font-family: var(--f-display); font-weight: 800; letter-spacing: .14em; font-size: .78rem; background: #241b0a; color: #5b4a2a; box-shadow: inset 0 0 0 2px #11171b; }
.mcaution.on { background: #ffb21f; color: #2a1a00; box-shadow: 0 0 14px rgba(255,178,31,.6); }
.beep { font-family: var(--f-mono); font-size: .72rem; color: var(--d-amber); visibility: hidden; }
.beep.on { visibility: visible; }

/* panel map */
.pmap { display: grid; gap: 6px; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-areas:
  "ovm ovh ovh ovh cb" "gs gs gs gs gs" "lsw lf cf rf rsw" ". fas fas fas ." ". cs cs cs ." ". aas aas aas ."; }
.pmap button { border: 0; border-radius: 8px; background: var(--panel); color: var(--panel-ink); font-family: var(--f-display); font-weight: 700; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; padding: 10px 6px; min-height: 52px; line-height: 1.1; box-shadow: inset 0 1px 0 var(--panel-hi); }
.pmap button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.pmap button:hover { filter: brightness(1.12); }
.pdet h4 { font-family: var(--f-display); font-size: 1.3rem; font-weight: 700; }
.pdet .ref { font-family: var(--f-mono); font-size: .76rem; color: var(--accent); }
.pdet ul { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; }
.pdet li { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); margin: 0 !important; font-size: .95rem; }
.chch { font-family: var(--f-mono); font-size: .72rem; padding: 3px 7px; border-radius: 5px; background: var(--sunk); color: var(--ink-2); text-decoration: none; white-space: nowrap; }
a.chch { background: var(--accent-soft); color: var(--accent-2); }

/* oxygen box */
.oxbox { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--panel-lo); border-radius: 8px; padding: 6px; min-height: 150px; }
.oxdoor { background: var(--panel); border-radius: 5px; padding: 10px; display: grid; align-content: space-between; justify-items: center; gap: 8px; transition: transform .2s; transform-origin: left center; }
.oxdoor.r { transform-origin: right center; }
.oxbox.open .oxdoor { transform: perspective(500px) rotateY(-62deg); opacity: .55; }
.oxbox.open .oxdoor.r { transform: perspective(500px) rotateY(62deg); }
.flag { font-family: var(--f-display); font-weight: 800; font-size: .74rem; letter-spacing: .12em; padding: 3px 8px; border-radius: 3px; background: #20272c; color: #20272c; }
.flag.on { background: #fff; color: #10161a; }
.flow { width: 40px; height: 40px; border-radius: 50%; background: #11171b; box-shadow: 0 0 0 2px #6b747a; position: relative; }
.flow.on::before, .flow.on::after { content: ""; position: absolute; left: 50%; top: 50%; width: 26px; height: 6px; margin: -3px 0 0 -13px; background: #ffd400; border-radius: 2px; transform: rotate(45deg); }
.flow.on::after { transform: rotate(-45deg); }
.oxout { font-size: var(--t-sm); }
.oxout b { font-family: var(--f-display); letter-spacing: .04em; }

/* sign boxes */
.signs { display: flex; gap: 10px; flex-wrap: wrap; }
.sign { flex: 1 1 140px; border-radius: 8px; background: #1a2025; color: #4a545b; padding: 10px; text-align: center; font-family: var(--f-display); font-weight: 800; letter-spacing: .1em; font-size: .86rem; box-shadow: inset 0 0 0 2px #0f1316; transition: all .15s; }
.sign.on { background: #fff6dc; color: #1a1200; box-shadow: 0 0 16px rgba(255,236,170,.55), inset 0 0 0 2px #e7d9a8; }
.deck { border-radius: 10px; background: #13191e; padding: 12px; display: grid; gap: 10px; color: #c7d0d7; }
.deck .ceil { display: flex; gap: 6px; justify-content: space-between; }
.deck .ceil i { flex: 1; height: 8px; border-radius: 4px; background: #2a3238; }
.deck.flash .ceil i { background: #fff4c9; box-shadow: 0 0 10px rgba(255,240,190,.7); animation: pulse .5s infinite; }
.deck .row { display: flex; justify-content: space-between; gap: 10px; font-size: .84rem; flex-wrap: wrap; }
.deck .horn { font-family: var(--f-display); font-weight: 800; letter-spacing: .12em; color: #3e484f; }
.deck .horn.on { color: var(--d-amber); animation: pulse .4s infinite; }
@media (prefers-reduced-motion: reduce) { .deck.flash .ceil i, .deck .horn.on { animation: none; } }

/* door mechanics view */
.mech svg { display: block; width: 100%; height: auto; max-height: 260px; }
.prog { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .1s linear; }
.annun { background: #d9dee2; color: #1b2328; border-radius: 10px; padding: 10px; }
.annun .pnl-t { color: #1b2328; }
.lgrid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
.lat { display: grid; gap: 2px; text-align: center; }
.lat b { font-family: var(--f-mono); font-size: .66rem; color: #4a555d; }
.lat i { display: block; height: 13px; border-radius: 2px; background: #2b3136; font-style: normal; font-family: var(--f-display); font-size: .5rem; font-weight: 800; letter-spacing: 0; line-height: 13px; color: #59636a; white-space: nowrap; overflow: hidden; }
.lat i.g { background: #2fd46a; color: #063015; }
.lat i.a { background: #ffb21f; color: #3a2400; }
.cl { display: flex; gap: 10px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
.cl button { border: 0; border-radius: 4px; display: grid; gap: 2px; padding: 4px; background: #2b3136; min-width: 74px; }
.cl button span { font-family: var(--f-display); font-size: .62rem; font-weight: 800; letter-spacing: .06em; border-radius: 2px; padding: 2px; color: #4b555c; }
.cl button span.g { background: #2fd46a; color: #063015; }
.cl button span.a { background: #ffb21f; color: #3a2400; }
.cl button em { font-style: normal; font-size: .6rem; font-family: var(--f-display); color: #9aa5ad; letter-spacing: .1em; }
.lsel { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 3px; }
.lsel button { border: 0; border-radius: 4px; background: #2a3237; color: var(--panel-dim); font-family: var(--f-mono); font-size: .7rem; padding: 6px 0; min-height: 30px; }
.lsel button[aria-pressed="true"] { background: #e9edf0; color: #1d2328; }

/* quiz */
.qz { max-width: 46rem; margin: 0 auto; }
.qz-top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.qz-top .prog { flex: 1; }
.qz-top .mono { font-size: .8rem; color: var(--ink-3); }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
.qcard .qref { font-family: var(--f-mono); font-size: .76rem; color: var(--accent); }
.qcard h2 { font-family: var(--f-body); font-weight: 700; font-size: 1.32rem; line-height: 1.35; margin: 8px 0 18px; text-wrap: pretty; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 2rem 1fr; gap: 10px; align-items: center; text-align: left; border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 1.02rem; min-height: 56px; color: var(--ink); }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt .l { font-family: var(--f-mono); font-weight: 700; font-size: .85rem; width: 1.8rem; height: 1.8rem; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); color: var(--ink-2); }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--green); background: var(--green-bg); }
.opt.right .l { background: var(--green); color: var(--surface); }
.opt.wrong { border-color: var(--red); background: var(--red-bg); }
.opt.wrong .l { background: var(--red); color: var(--surface); }
.why { margin-top: 16px; padding: 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line-2); }
.why b { font-family: var(--f-display); letter-spacing: .04em; font-size: 1.05rem; }
.why p { margin: 6px 0 0; }
.why .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; align-items: center; justify-content: space-between; }
.modes { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-top: 18px; }
.mode { text-align: left; display: grid; gap: 4px; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 16px; color: var(--ink); }
.mode:hover:not([disabled]) { border-color: var(--accent); }
.mode[disabled] { opacity: .5; cursor: default; }
.mode b { font-family: var(--f-display); font-size: 1.25rem; }
.mode span { font-size: var(--t-sm); color: var(--ink-3); }
.qsec { margin-top: 26px; }
.qsec select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); min-height: 44px; }
.score { font-family: var(--f-mono); font-size: 3.4rem; font-weight: 700; line-height: 1; }
.missed { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 8px; }
.missed li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 0 !important; }
.missed li small { display: block; color: var(--ink-3); margin-top: 4px; }

/* search */
.search-bg { position: fixed; inset: 0; z-index: 50; background: rgba(5, 10, 14, .5); display: flex; justify-content: center; align-items: flex-start; padding: calc(12px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 12px max(12px, env(safe-area-inset-left, 0px)); }
.search { width: min(680px, 100%); background: var(--surface); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.35); overflow: hidden; display: flex; flex-direction: column; max-height: calc(100vh - 40px); }
.search-in { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.search-in svg { width: 20px; height: 20px; stroke: var(--ink-3); fill: none; stroke-width: 2; flex: none; }
.search-in input { flex: 1; border: 0; background: transparent; font-size: 1.1rem; padding: 8px 4px; outline: none; min-width: 0; }
.search-in button { border: 0; background: var(--sunk); border-radius: 8px; padding: 6px 10px; font-size: .82rem; font-weight: 700; color: var(--ink-2); }
.results { overflow-y: auto; padding: 6px; }
.res { display: block; text-decoration: none; color: var(--ink); padding: 10px 12px; border-radius: 10px; }
.res:hover, .res:focus { background: var(--surface-2); }
.res b { display: block; font-family: var(--f-display); font-size: 1.05rem; }
.res span { display: block; font-size: var(--t-sm); color: var(--ink-2); }
.res small { font-family: var(--f-mono); font-size: .7rem; color: var(--accent); }
.res-empty { padding: 20px 14px; color: var(--ink-3); font-size: var(--t-sm); }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--chrome); color: var(--chrome-ink); padding: 10px 16px; border-radius: 10px; font-size: var(--t-sm); box-shadow: 0 8px 24px rgba(0,0,0,.3); max-width: calc(100vw - 32px); display: flex; gap: 12px; align-items: center; }
.toast button { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 7px; padding: 6px 10px; font-weight: 700; }

/* figure drawing */
.fig .ac path, .fig .ac rect, .fig .ac ellipse, .fig .ac circle { fill: var(--surface-2); stroke: var(--ink-2); stroke-width: .14; }
.fig .ac .far { fill: var(--sunk); }
.fig .ac .win { fill: var(--ink-2); stroke: none; }
.fig .ac .strut { fill: none; stroke: var(--ink-2); stroke-width: .3; }
.fig .dl { stroke: var(--accent); stroke-width: .14; fill: none; }
.fig .ex { stroke: var(--ink-3); stroke-width: .08; stroke-dasharray: .5 .4; fill: none; }
.fig .ah { fill: var(--accent); }
.fig .dt { fill: var(--ink); font-family: var(--f-mono); font-size: 2.1px; paint-order: stroke; stroke: var(--surface); stroke-width: .7px; stroke-linejoin: round; }
.fig .gnd { stroke: var(--ink-3); stroke-width: .15; }
.turnfig .dt { font-size: 2.7px; }
.turnfig .arc { fill: none; stroke: var(--accent); stroke-width: .22; stroke-dasharray: 1.2 .8; }
.turnfig .wheel { fill: var(--ink); }
.turnfig .ctr { stroke: var(--red); stroke-width: .35; }
.ac-night path, .ac-night rect { fill: #1c2a35; stroke: #4d6474; stroke-width: .16; }
.night svg { display: block; width: 100%; height: auto; max-height: 520px; }
.bm { fill: rgba(255, 244, 214, .22); }
.bm2 { fill: rgba(255, 244, 214, .14); }
.lt { transition: opacity .18s; }
.syn .ol { fill: none; stroke: #e6ecf0; stroke-width: 1.5; }
.syn .ld { fill: none; stroke: var(--d-cyan); stroke-width: .9; opacity: .8; }
.syn .lb { fill: var(--d-cyan); font-family: var(--f-mono); font-size: 12px; letter-spacing: .02em; }
.mech .fx { fill: #182630; stroke: #5d7586; stroke-width: .8; }
.mech .fl { stroke: #5d7586; stroke-width: .8; stroke-dasharray: 2 1.5; }
.mech .dr { fill: none; stroke: var(--d-amber); stroke-width: 2.4; stroke-linecap: round; }
.mech .hg { fill: #e6ecf0; }
.mech .ml, .mech .ml2 { fill: #7f95a5; font-family: var(--f-mono); }
.mech .ml { font-size: 4.2px; }
.mech .ml2 { font-size: 1.5px; }
.mech .fx2 { fill: #182630; stroke: #5d7586; stroke-width: .18; }
.mech .gl2 { stroke: #5d7586; stroke-width: .15; }
.mech .win2 { fill: #5d7586; }
.mech .dr2 { fill: rgba(255,178,31,.14); stroke: var(--d-amber); stroke-width: .3; }

</style>

        ["Navigation", "Red (left forward wingtip), green (right forward wingtip), white (tail cone)."],
        ["Marker", "Aft-facing, on the underside of each wingtip. Light the wingtip area on the ground."],
        ["Logo", "On the stabilizer, lighting the logo on the vertical tail."],
        ["Wing", "On the fuselage, lighting the wings and engine nacelles."]
      ]}
    ]
  },

  /* ───────────────────────── 8. OXYGEN ───────────────────────── */
  {
    id: "oxygen", title: "Oxygen", ref: "1.30.17 · 1.40.7 · 1.45.3",
    summary: "Crew quick-donning masks and regulators, the supernumerary system and its tail-specific effects, and portable bottles.",
    blocks: [
      { t: "p", html: "There are two independent systems, one for the flight crew and one for the supernumeraries, plus portable cylinders in the cabin for emergency use. Both cylinder pressures show on the EICAS STATUS page." },
      { t: "facts", items: [
        ["~14,000 ft", "Cabin altitude, supernumerary masks drop"],
        ["12,000 ft", "Below this, RESET closes the flow control unit"],
        ["STAT", "Oxygen pressures on the status page"]
      ]},
      { t: "h", text: "Flight crew oxygen" },
      { t: "p", html: "Each crew station has a quick-donning diluter-demand mask. An automatic pressure-breathing regulator on each mask controls flow. After donning, pull the goggle nose piece away from the face to remove the goggles; push them back until they click to replace them." },
      { t: "widget", id: "crewOxy" },
      { t: "ctrl", name: "OXY PR display", where: "EICAS STATUS page", ref: "1.30.17", pos: [
        ["", "Crew and supernumerary (PASS) oxygen cylinder pressure in PSI. Selected with the STAT switch on the display select panel."]
      ]},
      { t: "ctrl", name: "NORMAL / 100% switch", where: "Mask regulator", ref: "1.30.18", pos: [
        ["N", "Air/oxygen mixture on demand. The ratio depends on cabin altitude."],
        ["100%", "100% oxygen on demand, no air mixed in."]
      ]},
      { t: "ctrl", name: "EMERGENCY / test selector", where: "Mask regulator", ref: "1.30.18", pos: [
        ["Normal", "Air/oxygen mixture or 100% on demand, as set by the N/100% switch."],
        ["EMERGENCY", "Rotate in the arrow direction. 100% oxygen under positive pressure at all cabin altitudes, protecting against smoke and harmful vapours. Also used to purge contaminants and clear fogging from the mask lens."],
        ["PRESS TO TEST", "Tests the positive pressure supply to the regulator."]
      ]},
      { t: "note", k: "caution", html: "EMER mode depletes oxygen faster than 100% or NORM. Use EMER only as conditions require." },
      { t: "note", k: "note", html: "Communication in EMER mode may be difficult. Switch to 100% or NORM if conditions allow." },
      { t: "ctrl", name: "Oxygen mask release levers", where: "Mask stowage box", ref: "1.30.19", pos: [
        ["Squeeze and pull", "Unlocks the stowage box doors and releases the mask. Oxygen turns on when the doors open. The flow indicator shows a yellow cross momentarily as the harness inflates. Opening the left door activates the mask microphone."],
        ["Squeeze (right lever)", "Inflates the mask harness."],
        ["Release", "Deflates the harness onto the head and face."]
      ]},
      { t: "ctrl", name: "Oxygen flow indicator", where: "Mask stowage box", ref: "1.30.19", pos: [
        ["Yellow cross", "Oxygen flowing."]
      ]},
      { t: "ctrl", name: "RESET / TEST switch", where: "Mask stowage box, left door", ref: "1.30.20", pos: [
        ["Push, OXY ON not shown", "With the left door closed, turns oxygen on momentarily to test the regulator."],
        ["Push, OXY ON shown", "With the left door closed, turns oxygen off, deactivates the mask microphone and activates the boom microphone."]
      ]},
      { t: "ctrl", name: "OXY ON flag", where: "Mask stowage box, near the left door", ref: "1.30.20", pos: [
        ["In view", "Oxygen supply valve open; oxygen is on."]
      ]},
      { t: "note", k: "note", html: "During the preflight mask check, a pressure decrease may mean the crew oxygen cylinder shutoff valve is closed and oxygen is unavailable." },
      { t: "p", html: "To shut the system off, close the left-hand stowage box door and push and release [[RESET/TEST]]. That shuts off oxygen to the mask, stows the flag, deactivates the mask mic and activates the boom mic. Opening the left door again reactivates oxygen." },
      { t: "h", text: "Donning" },
      { t: "note", k: "note", html: "Remove the headset entirely before donning the mask, to avoid interference between headset and mask." },
      { t: "steps", items: [
        "Grasp and squeeze the regulator's red inflation levers to remove the mask from the stowage box.",
        "Pull the mask out and away from the box, making sure there is plenty of hose extension.",
        "Face inboard to stay clear of flight deck obstructions. Place the inflated harness behind your head with the lower harness tube near the neck. You may need to tilt your head.",
        "With the harness tight to the back of the head, bring the mask down and away from the face, forehead to chin.",
        "Release the inflation levers and guide the mask onto the face.",
        "Adjust for a comfortable, snug fit."
      ]},
      { t: "h", text: "Stowing" },
      { t: "note", k: "warning", html: "During mask stowage, do not push the red inflation lever on the demand regulator. This inflates the harness and can prevent proper deployment later. If the harness inflates during stowage, release the lever to vent the oxygen and start the stowage again." },
      { t: "steps", items: [
        "Fully extend the supply hose from the box. If the system is charged you will hear oxygen filling the hose.",
        "Rotate the mask so the hose is not twisted on itself.",
        "Check the supply hose, microphone cable and harness for damage. The cross straps should cover the manufacturer's location marks on the harness.",
        "Set the regulator to 100% (press the N/100% rocker) and turn the EMERGENCY knob counterclockwise to off.",
        "Coil the hose slack into the recess in the bottom of the box in a figure-eight. Do not tangle or twist it.",
        "Lay the rest of the hose leading to the mask against the side of the box with the retainer mechanism, and press the coil down gently.",
        "Hold the mask by the regulator, goggles end first, with harness, retainer strap and clip, and hose between the face piece and the retainer side of the box.",
        "Make sure the harness is fully deflated and hangs freely.",
        "Engage the retainer strap clip in the retainer mechanism until it clicks.",
        "Insert harness and goggles, then face piece and regulator, without trapping the harness inside the goggles or face piece. Guide the hose down the centre at the same time.",
        "Continue inserting regulator and hose, keeping the hose centred and the lens clear of the box.",
        "Guide the regulator stowage tabs into the box clip stop until they click.",
        "Confirm the dilution control is at 100% (toggle down) and the safety button is in normal (rotated counterclockwise).",
        "Close the doors without catching the hose or retainer strap. The retainer clip should be visible and fully engaged.",
        "Push and release PRESS TO TEST AND RESET on the left door. If charged, you will hear oxygen venting from the hose. Confirm the OXY ON flag disappears.",
        "Press and release PRESS TO TEST on the regulator."
      ]},
      { t: "note", k: "warning", html: "Do not trap the harness inside the goggles or face piece. Do not stow the mask without engaging the retainer clip; a clip that is not fully engaged may prevent the mask from deploying." },
      { t: "note", k: "note", html: "If a lot of hose is left outside the box doors, do not push it in. Remove the mask and repack it." },
      { t: "h", text: "Supernumerary oxygen" },
      { t: "ctrl", name: "SUPRNMRY OXY switch", where: "Overhead panel", ref: "1.30.17", pos: [
        ["RESET", "Spring-loaded toggle. Closes the flow control unit electrically when cabin altitude is below 12,000 feet."],
        ["NORM", "Guard closed. System activates if cabin altitude reaches about 14,000 feet."],
        ["ON", "Spring-loaded toggle. Supernumerary oxygen masks drop."]
      ]},
      { t: "ul", items: [
        "Supplied by bottled gaseous oxygen, feeding oxygen boxes in the passenger and lavatory service units above the supernumerary seats.",
        "Masks drop automatically above about 14,000 feet cabin altitude, or manually with the switch at ON.",
        "Flow to a mask starts when the mask or its streamer is pulled down.",
        "When a mask is no longer needed, set the manifold toggle valve in that oxygen box to CLOSE. This saves oxygen and increases flow to masks still in use.",
        "Select RESET on the overhead switch to reset oxygen flow."
      ]},
      { t: "note", k: "eff", html: "<b>JA15KZ – JA18KZ:</b> when the masks deploy, ceiling lights flash and an aural tone sounds in the crew rest for several seconds.<br><b>JA11KZ – JA14KZ:</b> when the masks deploy, main deck ceiling lights flash and the crew rest ceiling lights illuminate." },
      { t: "h", text: "Portable oxygen" },
      { t: "p", html: "Portable and walk-around bottles are stowed in the supernumerary area. Portable bottles have a disposable mask and safety straps and are for first aid. Walk-around bottles have a full face mask and a larger bottle." },
      { t: "eicas", rows: [
        ["CREW OXY LOW", "Advisory", "", "Crew oxygen pressure low."],
        ["SUPRNRY OXY LO", "Advisory", "", "Supernumerary oxygen pressure low."],
        ["SUPRNMRY OXY ON", "Advisory", "", "Supernumerary oxygen system activated."]
      ]}
    ]
  },

  /* ───────────────────────── 9. EMERGENCY EQUIPMENT ───────────────────────── */
  {
    id: "emerequip", title: "Emergency Equipment", ref: "1.30.20 · 1.45 · 1.50.4",
    summary: "ELTs, fire extinguishers, flashlights, and the escape devices and harnesses for the overhead hatch and upper deck door.",
    blocks: [
      { t: "h", text: "Emergency locator transmitters" },
      { t: "ctrl", name: "ELT switch", where: "Overhead panel", ref: "1.30.20", pos: [
        ["ON", "Transmits the emergency locator signal."],
        ["ARMED", "Guard closed. Transmits if activated by high deceleration forces."],
        ["RESET", "Spring-loaded toggle. Ends transmission."]
      ]},
      { t: "ul", items: [
        "<b>Fixed ELT:</b> fuselage-mounted on the main deck aft overhead. Activates on high deceleration or with the switch ON.",
        "<b>To deactivate:</b> move the switch to RESET momentarily (between 1 and 3 seconds), then back to ARMED.",
        "<b>Supernumerary area:</b> one ELT on the upper deck closet exterior wall, across from the upper deck crew service door."
      ]},
      { t: "eicas", rows: [
        ["ELT ON", "Advisory", "", "The emergency locator transmitter is on."]
      ]},
      { t: "h", text: "Fire extinguishers" },
      { t: "p", html: "Chemical and water extinguishers are on the flight deck, in the supernumerary area and in the main deck cargo area. Directions for use are printed on each extinguisher." },
      { t: "ul", items: [
        "<b>Chemical:</b> liquefied gas agent under pressure that vaporizes on release. Effective on all fire types, used mainly on electrical, fuel and grease fires. The pressure indicator shows acceptable, recharge and overcharged ranges. A safety pin with pull ring prevents accidental discharge.",
        "<b>Water:</b> water with antifreeze, for fabric or paper fires only. To use, remove from stowage, rotate the handle fully clockwise, aim at the base of the fire and press the trigger."
      ]},
      { t: "note", k: "warning", html: "If a chemical fire extinguisher is to be discharged in the flight deck area, all flight crew members must wear oxygen masks and use 100% oxygen with EMERGENCY selected." },
      { t: "note", k: "caution", html: "For electrical fires, remove the power source as soon as possible. Avoid discharging directly on persons because of possible suffocating effects. Do not discharge too close to the fire, as the stream may scatter it. Keep away from the fuel source and avoid breathing vapours, fumes and heated smoke." },
      { t: "note", k: "warning", html: "The water extinguisher contains antifreeze, which makes it unfit for drinking. Do not use it on electrical or grease fires." },
      { t: "h", text: "Flashlights" },
      { t: "p", html: "High-intensity flashlights are stowed throughout the airplane. They switch on automatically when removed from the bracket and only go off when put back. The batteries are not rechargeable." },
      { t: "table", head: ["Condition light", "Meaning"], rows: [
        ["One green flash on test", "Normal battery charge"],
        ["One red flash on test", "Replace the battery"],
        ["Flashes every 10 seconds", "Battery at end of life"]
      ]},
      { t: "h", text: "Escape devices and harnesses" },
      { t: "ul", items: [
        "<b>Eight emergency escape devices</b> are stowed next to the flight deck overhead hatch. Remove one from its holder and exit through the overhead hatch or the upper deck door while holding the handle. Inertia reels limit the descent speed.",
        "An escape device can also be used to evacuate over the slide if the airplane tips tail down.",
        "<b>One emergency descent harness per escape device</b> is stowed in the upper deck cabin. Don the garment, attach its hook to the fastening ring on an escape device handle, and leave through the overhead hatch or upper deck door."
      ]},
      { t: "note", k: "warning", html: "Make sure the descent device is securely fastened to the airplane by pulling sharply on the lanyard before exiting." },
      { t: "steps", items: [
        "Don the garment with the buckles forward.",
        "Put the black strap over the shoulder and tighten.",
        "Tighten the strap.",
        "Hook the snap on the end of the strap to the escape reel.",
        "Hold onto the escape reel and exit through the overhead hatch, using the seats as footholds. Avoid straddling other lines.",
        "On the ground, unhook the red strap and move to a safe area before removing the garment."
      ]},
      { t: "note", k: "note", html: "If evacuating into water, don the garment before the life vest. Do not inflate the vest inside the airplane." }
    ]
  },

  /* ───────────────────────── 10. DOORS & EXITS ───────────────────────── */
  {
    id: "doors", title: "Doors and Exits", ref: "1.30.22 · 1.50.1",
    summary: "The freighter's door inventory, the doors synoptic and EICAS messages, the upper deck door and slide, the overhead hatch and the crew ladder.",
    blocks: [
      { t: "p", html: "The 747-8F has one main deck entry door, one upper deck door and five cargo doors (three lower, the side cargo door and the nose cargo door). It also has two electrical and electronic (E/E) equipment access doors and one flight deck overhead hatch." },
      { t: "note", k: "caution", html: "Do not operate the entry or cargo doors with winds at the door of more than 40 knots. Do not keep doors open when wind gusts are more than 65 knots. Strong winds can damage the airplane structure." },
      { t: "widget", id: "doorsSynoptic" },
      { t: "h", text: "Main deck entry door (1L)" },
      { t: "ctrl", name: "Door operating handle", where: "Main deck entry door", ref: "1.30.23", pos: [
        ["OPEN", "Rotating the handle unlatches the door. The door moves inward, then outward."],
        ["Close", "Rotating the handle latches the door closed."]
      ]},
      { t: "ul", items: [
        "Manually operated with no power assist. Opens from inside or outside.",
        "An escape rope is stowed above the door.",
        "Threshold lights illuminate when the emergency lights are activated.",
        "The hold-open release lever on the body frame disengages when lifted, allowing the door to close."
      ]},
      { t: "h", text: "Upper deck door" },
      { t: "p", html: "The upper deck door is the emergency evacuation door, on the right side of the upper deck." },
      { t: "ctrl", name: "Door handle (interior)", where: "Upper deck door", ref: "1.30.26", pos: [
        ["Pull and rotate clockwise", "Unlocks the latches and swings the door inboard on its upper and lower hinges, toward OPEN. The door then runs aft on upper and lower tracks."]
      ]},
      { t: "ctrl", name: "Door latch manual handle", where: "Upper deck door", ref: "1.30.26", pos: [
        ["Push", "Releases the door from the aft stowed position so it can slide forward on the tracks."]
      ]},
      { t: "ul", items: [
        "<b>From outside:</b> push the tabs to release the handles, then rotate the handles to unlatch and open. The exterior handles must be stowed before moving the door aft on the tracks.",
        "<b>Closing:</b> from either side. Push the door latch manual handle, slide the door forward, then rotate the interior or exterior handle to close and latch it."
      ]},
      { t: "h", text: "Upper deck escape slide" },
      { t: "p", html: "The slide is mounted on tracks parallel to the door and the right bulkhead. Set the platform lock control lever to Unlocked and use the assist handle to move it. It locks in several positions, including forward (in front of the door) and aft (clear of the door)." },
      { t: "steps", items: [
        "Slide in the forward position, crew service door open.",
        "Pull the packboard manual release handle.",
        "Rotate the escape slide out through the open doorway.",
        "The slide inflates automatically. If it does not, pull down on the manual inflation handle."
      ]},
      { t: "note", k: "warning", html: "Use caution when pushing the slide out of the door to avoid falling out of the open door." },
      { t: "note", k: "caution", html: "Do not pull the manual inflation handle unless the packboard is out through the doorway." },
      { t: "note", k: "caution", html: "The escape slide is unusable if the airplane tips tail down on the ground. Use the escape devices instead." },
      { t: "p", html: "Slide components: escape slide pack, packboard, packboard manual release handle, platform lock control, assist handle, chute extension panel, floor tracks and floor ramp; when deployed, the stored gas bottle, chute, girt, manual inflation handle and ramp plate." },
      { t: "h", text: "Flight deck overhead hatch" },
      { t: "ul", items: [
        "Just aft of the overhead panels. Opens from inside or outside.",
        "<b>Inside:</b> rotate the interior handle 180° counterclockwise to unlock, then pull the hatch inward.",
        "<b>Outside:</b> press the release trigger so the exterior handle springs out of its recess, then rotate the handle to unlock."
      ]},
      { t: "note", k: "caution", html: "The overhead hatch is hinged to open inward. Take care to avoid injury when opening it." },
      { t: "h", text: "Upper deck crew access ladder" },
      { t: "p", html: "The ladder is retracted to the ceiling during cargo loading and unloading and extended at all other times. The ladder enclosure must be closed during taxi, takeoff, flight and landing. The stow assist tool is on the side panel next to Door 1L." },
      { t: "note", k: "caution", html: "Always use the handrail when climbing or descending the ladder. Face the ladder when climbing or descending." }
    ]
  },

  /* ───────────────────────── 11. CARGO DOORS ───────────────────────── */

      { t: "h", text: "Lower cargo doors" },
      { t: "ul", items: [

        "Forward and aft open outward; bulk opens inward.",
        "Forward and aft are normally operated electrically from an exterior panel forward of each door. A light on the panel shows latching. Locking and unlocking is manual, and both can be operated manually if necessary.",

      { t: "h", text: "Side cargo door" },

        ["LATCHED CLOSED (green)", "Latch lock handles released with the door closed and latches engaged."],
        ["DOOR UP (green)", "Door in the full open position."]

        ["OFF", "Lights off."]

      { t: "p", html: "Both panels also have an interphone jack and a window in the door." },
      { t: "h", text: "Nose cargo door" },
      { t: "p", html: "The nose cargo door is powered by the <b>main deck cargo handling bus</b> and controlled from the nose cargo door and light control panel. A mechanical system operates the door when electrical power is not available." },
      { t: "widget", id: "noseDoor" },
      { t: "ul", items: [
        "With [[SYSTEM POWER]] ON, the POWER ON and LATCHES CLOSED lights illuminate.",
        "Hold [[SYSTEM POWER]] ON and [[DOOR CONTROL]] OPEN to open; hold ON and CLOSE to close.",
        "Release either switch to stop and hold the door at any point.",
        "[[OFF/LOCK TEST]]: control system unpowered, lock-out engaged, LOCK-OUT ENGAGED illuminates, LATCHES CLOSED goes out.",
        "Release the switch and LOCK-OUT ENGAGED goes out. That confirms power is removed and electrical lock-out is engaged.",
        "If power is not removed from the control system, a doors EICAS alert message displays."
      ]},
      { t: "ctrl", name: "SYSTEM POWER switch", where: "Nose cargo door control panel", ref: "1.30.34", pos: [
        ["ON", "Momentary. Powers the control system, makes lamp test and door control available, lights POWER ON. Door operation stops when released."],
        ["OFF / LOCK TEST", "Lock-out engaged; LOCK-OUT ENGAGED light illuminates."]
      ]},
      { t: "ctrl", name: "DOOR CONTROL switch", where: "Nose cargo door control panel", ref: "1.30.34", pos: [
        ["OPEN", "Powers the door actuation system open, with SYSTEM POWER ON."],
        ["CLOSE", "Powers the door actuation system closed, with SYSTEM POWER ON."]
      ]},
      { t: "ctrl", name: "Nose door control panel lights", where: "Nose cargo door control panel", ref: "1.30.33", pos: [
        ["POWER ON (white)", "Main deck cargo handling bus powered and SYSTEM POWER ON."],
        ["LOCK-OUT ENGAGED (green)", "OFF/LOCK TEST selected with the main deck cargo handling bus on AC power."],
        ["LATCHES CLOSED (green)", "All latch pins fully latched."],
        ["DOOR UP (blue)", "Door in the full up position."]
      ]},
      { t: "h", text: "Latch actuator test panel" },
      { t: "ctrl", name: "LATCH SELECT", where: "Latch actuator test panel", ref: "1.30.35", pos: [
        ["1L–8L, 1R–8R", "Selects one of the sixteen latches for test."],
        ["LATCH CLOSED TEST", "Push: LATCH CLOSED light illuminates (green) if the selected latch is closed."],
        ["LATCH OPEN TEST", "Push: LATCH OPEN light illuminates (green) if the selected latch is open."],
        ["LAMP TEST", "Push: both lights illuminate when test power is available."]
      ]},
      { t: "h", text: "Annunciator panels" },
      { t: "p", html: "The latch annunciator and door closed annunciator give closed and latched indication with the control system unpowered." },
      { t: "ctrl", name: "Latch annunciator", where: "Nose cargo door latch annunciator assembly", ref: "1.30.37", pos: [
        ["LATCHED (green)", "Respective latch closed and latched."],
        ["NOT LCHD (amber)", "Respective latch not latched."]
      ]},
      { t: "ctrl", name: "Door closed annunciator", where: "Left and right", ref: "1.30.38", pos: [
        ["CLOSED (green)", "Door closed. Push to test."],
        ["NOT CLOSED (amber)", "Door not closed. Push to test."]
      ]},
      { t: "eicas", rows: [
        ["DOOR SIDE CARGO", "Caution", "Beeper", "Side cargo door not closed, latched and locked condition sensed."],
        ["DOOR NOSE CARGO", "Caution", "Beeper", "Nose cargo door is not closed, latched and locked condition sensed."],
        ["DOOR FWD CARGO", "Caution", "Beeper", "Forward cargo door is not closed and secure."],
        ["DOOR AFT CARGO", "Caution", "Beeper", "Aft cargo door is not closed and secure."],
        ["DOOR BULK CARGO", "Advisory", "", "Bulk cargo door is not closed and secure."]
      ]}
    ]
  },

  /* ───────────────────────── 12. SEATS ───────────────────────── */
  {
    id: "seats", title: "Flight Deck Seats", ref: "1.50.8",
    summary: "Pilot seat adjustments and eye position, and the two observer seats.",
    blocks: [
      { t: "p", html: "There are three seat types: the pilot seats, the first observer seat and the second observer seat." },
      { t: "h", text: "Pilot seats" },
      { t: "ul", items: [
        "Recline, vertical, fore/aft, thigh support and lumbar adjustment.",
        "Adjustable armrests, crotch straps, lap belts, adjustable headrests, and inertia-reel shoulder harnesses with manual locks.",
        "The seats move outboard during the last four inches of aft travel.",
        "Electric and manual controls give fore/aft and vertical adjustment; manual levers handle the rest.",
        "The master ON/OFF switch is behind the lumbar in/out handwheel.",
        "Lumbar and thigh pad support use handwheels. Armrest pitch uses the knob under the armrest, and the armrests stow vertically for access."
      ]},
      { t: "p", html: "Adjust the seat until the eye position indicator balls are level with your eyes and the nearer ball hides the centre ball. The best recline is near or slightly aft of fully upright." },
      { t: "note", k: "warning", html: "When using the manual release lever, make sure seat motion has stopped before releasing the fore/aft lever. Releasing it while the seat is still moving can damage the seat actuator. Manually moving the seat to the forward or aft stop is permissible." },
      { t: "h", text: "Observer seats" },
      { t: "ul", items: [
        "<b>First observer:</b> pedestal-mounted, manual vertical and fore/aft adjustment. Folding armrest on the left, crotch strap, lap belt, adjustable headrest, inertia-reel shoulder harness with manual locks.",
        "<b>Second observer:</b> not adjustable. Folding armrests, crotch strap, lap belt, adjustable headrest, shoulder harness with manual locks."
      ]}
    ]
  },
